name: NORTH native bootstrap NAT lifecycle regression

on:
  push:
    branches:
      - fix/north-one-command-fresh-install-bootstrap
  pull_request:
    paths:
      - goad/course1_vmnet_config.py
      - goad/course1_host_network_apply.py
      - tests/test_course1_vmnet_config.py
      - tests/test_course1_retired_nat_attestation.py
      - tests/test_course1_one_command_bootstrap.py
      - .github/workflows/north-native-nat-retirement.yml

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and source qualification
        run: |
          python -m py_compile goad/course1_vmnet_config.py goad/course1_host_network_apply.py tests/test_course1_vmnet_config.py tests/test_course1_retired_nat_attestation.py tests/test_course1_one_command_bootstrap.py
      - name: Strict NAT and native NORTH install regression
        run: |
          python -m unittest -v \
            tests.test_course1_vmnet_config \
            tests.test_course1_retired_nat_attestation \
            tests.test_course1_host_network_apply \
            tests.test_course1_one_command_bootstrap
