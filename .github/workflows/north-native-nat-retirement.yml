name: NORTH native bootstrap NAT lifecycle regression

on:
  push:
    branches:
      - fix/north-one-command-fresh-install-bootstrap
  pull_request:
    paths:
      - goad/course1_vmnet_config.py
      - goad/course1_host_network_apply.py
      - tests/test_course1_vmnet_config.py
      - tests/test_course1_retired_nat_attestation.py
      - goad/course1_pre_ad_resume.py
      - tests/test_course1_pre_ad_resume.py
      - scripts/north-ws01-eval-maintenance.py
      - ansible/north-ws01-eval-maintenance.yml
      - ansible/roles/settings/eval_rearm/tasks/main.yml
      - tests/test_course1_ws01_eval_maintenance.py
      - goad/course1_snapshot_restore.py
      - goad/course1_network_retire.py
      - goad/course1_direct_winrm.py
      - tests/test_course1_direct_winrm.py
      - tests/test_course1_direct_bootstrap_integration.py
      - tests/test_north_provider_canonical_resume.py
      - scripts/north-one-shot-clean-reinstall.sh
      - tests/test_north_one_shot_reset_script.py
      - scripts/validate-north-runtime.sh
      - ansible/north-exercise-health-readonly.yml
      - tests/test_north_runtime_validation.py
      - scripts/north-lifecycle-acceptance.sh
      - tests/test_north_lifecycle_acceptance.py
      - goad/provider/vagrant/vmware_nomad.py
      - tests/test_course1_network_retire.py
      - tests/test_course1_snapshot_restore.py
      - goad_nomad.py
      - goad/provider/vagrant/vmware_kingdoms.py
      - tests/test_install_noninteractive.py
      - .github/workflows/north-native-nat-retirement.yml

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and source qualification
        run: |
          python -m py_compile goad/course1_vmnet_config.py goad/course1_host_network_apply.py goad/course1_pre_ad_resume.py tests/test_course1_vmnet_config.py tests/test_course1_retired_nat_attestation.py tests/test_course1_pre_ad_resume.py scripts/north-ws01-eval-maintenance.py tests/test_course1_ws01_eval_maintenance.py goad/course1_snapshot_restore.py tests/test_course1_snapshot_restore.py goad/course1_network_retire.py tests/test_course1_network_retire.py goad/course1_direct_winrm.py tests/test_course1_direct_winrm.py tests/test_course1_direct_bootstrap_integration.py tests/test_north_provider_canonical_resume.py tests/test_north_one_shot_reset_script.py tests/test_north_runtime_validation.py tests/test_north_lifecycle_acceptance.py goad_nomad.py goad/provider/vagrant/vmware_kingdoms.py tests/test_install_noninteractive.py
      - name: Strict NAT and native NORTH install regression
        run: |
          python -m unittest -v \
            tests.test_course1_vmnet_config \
            tests.test_course1_retired_nat_attestation \
            tests.test_course1_host_network_apply \
            tests.test_course1_pre_ad_resume \
            tests.test_course1_ws01_eval_maintenance \
            tests.test_course1_snapshot_restore \
            tests.test_course1_network_retire \
            tests.test_course1_direct_winrm \
            tests.test_course1_direct_bootstrap_integration \
            tests.test_north_provider_canonical_resume \
            tests.test_north_one_shot_reset_script \
            tests.test_north_runtime_validation \
            tests.test_north_lifecycle_acceptance
