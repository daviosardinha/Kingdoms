permissions:
  contents: read

jobs:
  windows-parent-winrs:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exercise native parent WinRS transport and failure paths
        shell: powershell
        env:
          KINGDOMS_TEST_NORTH_WINRS: '1'
        run: ./tests/test_north_parent_winrs.ps1

  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and source qualification
        run: |
          bash -n scripts/setup-vmware-networks.sh
          bash -n scripts/lab-mode.sh
          bash -n scripts/north-observed-cold-start.sh
          python -m py_compile scripts/north-exercise-winrm.py tests/test_north_exercise_direct_dc02.py goad/course1_foreign_nat.py tests/test_north_purple_vagrant_forwarding.py goad/course1_vmnet_config.py goad/course1_host_network_apply.py goad/course1_pre_ad_resume.py tests/test_course1_vmnet_config.py tests/test_course1_retired_nat_attestation.py tests/test_course1_pre_ad_resume.py tests/test_north_repaired_provider_resume.py scripts/north-ws01-eval-maintenance.py tests/test_course1_ws01_eval_maintenance.py goad/course1_snapshot_restore.py goad/course1_snapshot_evidence.py tests/test_course1_snapshot_restore.py tests/test_north_snapshot_evidence.py goad/course1_network_retire.py goad/course1_full_backup.py tests/test_course1_network_retire.py tests/test_north_full_backup_fifth_install.py goad/course1_direct_winrm.py scripts/diagnostics/diagnose_north_dc02_bootstrap.py tests/test_north_dc02_bootstrap_diagnostics.py goad/course1_tools_transition.py goad/course1_install_diagnostics.py tests/test_north_install_diagnostics.py tests/test_north_exclusive_install_lock.py tests/test_north_tools_transition.py tests/test_north_ws01_idle_signed_orphan.py tests/test_north_ws01_pre_vagrant_resume.py tests/test_course1_direct_winrm.py tests/test_course1_direct_bootstrap_integration.py tests/test_north_provider_canonical_resume.py tests/test_north_one_shot_reset_script.py tests/test_north_runtime_validation.py goad/course1_recovered_runtime.py tests/test_north_recovered_runtime_metadata.py tests/test_north_lifecycle_acceptance.py tests/test_north_two_cold_starts.py tests/test_north_time_transport_evidence.py tests/test_north_third_clean_install.py tests/test_north_fourth_clean_install.py tests/test_north_sixth_clean_install.py tests/test_north_ws01_post_rearm_readiness.py scripts/diagnostics/diagnose-north-ws01-vmtools.py tests/test_north_ws01_vmtools_diagnostics.py scripts/north-ws01-vmtools-repair.py tests/test_north_ws01_vmtools_repair.py scripts/north-srv02-vmtools-repair.py tests/test_north_srv02_vmtools_repair.py goad_nomad.py goad/provider/vagrant/vmware_kingdoms.py tests/test_install_noninteractive.py tests/test_fresh_install_bootstrap.py tests/test_course1_routes.py goad/course1_finalization_recovery.py tests/test_north_finalization_recovery.py goad/installed_member_time_recovery.py tests/test_installed_member_time_recovery.py tests/test_north_failed_start_isolation.py tests/test_north_verified_cold_start_isolation.py tests/test_north_parent_transport_evidence.py tests/test_north_parent_winrs_readonly_variable.py goad/provider/vagrant/vagrant.py scripts/diagnostics/north-installed-time-evidence.py tests/test_north_w32time_evidence.py tests/test_north_observed_cold_start.py
      - name: Strict NAT and native NORTH install regression
        run: |
          python -m unittest -v \
            tests.test_course1_vmnet_config \
            tests.test_north_purple_vagrant_forwarding \
            tests.test_course1_retired_nat_attestation \
            tests.test_course1_host_network_apply \
