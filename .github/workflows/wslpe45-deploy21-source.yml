name: WSLPE21 deployment source validation
on:
  push:
    branches: [feature/wslpe45-single-candidate-pilot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml ansible-core==2.17.14
      - run: ansible-galaxy collection install ansible.windows:==2.8.0
      - name: Python syntax and behavioral contracts
        run: |
          python -m py_compile kingdoms/wslpe45_deploy21.py scripts/wslpe45-deploy21.py scripts/wslpe41-freeze.py scripts/wslpe41-learner-acceptance.py scripts/wslpe41-clone-audit.py
          python -m unittest -v tests.test_wslpe41_freeze tests.test_wslpe41_learner_acceptance tests.test_wslpe41_clone_audit tests.test_wslpe45_deploy21 tests.test_wslpe45_batch_operator tests.test_wslpe45_controller_dependencies tests.test_wslpe45_single_pilot tests.test_wslpe45_library_lockdown tests.test_wslpe45_service_consumers tests.test_wslpe45_boundary_services tests.test_wslpe45_candidate_traversal tests.test_wslpe45_jea_candidate tests.test_wslpe45_scm_create_acl tests.test_wslpe45_task_definition_acl tests.test_wslpe45_registry_trust tests.test_wslpe45_com_candidate tests.test_wslpe45_lsa_rights tests.test_wslpe45_wmi_consumer_candidate
          python scripts/wslpe45-deploy21.py
      - name: Real Ansible syntax checks without guest access
        run: |
          python - <<'PY'
          import os, subprocess
          from kingdoms.wslpe45_deploy21 import selection, PREFLIGHT, JEA, INSPECT27, ROOT
          paths = [r['playbook'] for r in selection()] + [str(PREFLIGHT),str(JEA),str(INSPECT27),str(ROOT/'ansible/wslpe45/deploy21-recover27.yml'),str(ROOT/'ansible/wslpe45/deploy21-complete27.yml')]
          env = dict(os.environ)
          env.pop('ANSIBLE_CONFIG',None)
          for path in paths:
              subprocess.run(['ansible-playbook','--syntax-check','-i','localhost,',str(path)],
                             env=env,check=True)
          PY
      - name: Frozen baseline and excluded mechanisms unchanged
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','6043850b667b377c427eb72b90f97ac819bdf758','HEAD'],text=True).splitlines()
          forbidden=('ansible/roles/windows_lpe/','ad/','kingdoms/wslpe45_implementation_index.yml',
                     'ansible/files/wslpe45/WslpeFixture.psm1',
                     'ansible/files/wslpe45/WslpeJea.psm1','ansible/files/wslpe45/WslpeJeaLocal.psm1')
          for path in changed:
              assert not path.startswith(forbidden), path
              assert not any(x in path for x in ('Kingdom25','Kingdom36','Kingdom38','Kingdom40','Wslpe25','Wslpe40')),path
          PY
  powershell-51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Extract all selected playbook scripts
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import yaml
          out=Path(os.environ['RUNNER_TEMP'])/'wslpe21-ps'
          out.mkdir()
          index=yaml.safe_load(Path('kingdoms/wslpe45_implementation_index.yml').read_text())
          paths=[Path(r['playbook']) for r in index['techniques'] if r['number'] not in (25,36,38,40)]
          paths += [Path('ansible/wslpe45')/name for name in ('deploy21-preflight.yml','deploy21-jea-status.yml','deploy21-inspect27.yml','deploy21-recover27.yml','deploy21-complete27.yml','lockdown-library.yml')]
          for path in paths:
              parsed=yaml.safe_load(path.read_text())
              tasks=parsed if path.name=='lockdown-library.yml' else [
                  t for p in parsed for key in ('pre_tasks','tasks','post_tasks') for t in p.get(key,[])]
              for i,t in enumerate(tasks):
                  script=t.get('ansible.windows.win_powershell',{}).get('script')
                  if script:
                      (out/(path.stem+str(i)+'.ps1')).write_text(script,encoding='utf-8-sig')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
      - name: Parse with native Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Not Windows PowerShell 5.1'}
          $files=@(Get-ChildItem "$env:RUNNER_TEMP/wslpe21-ps" -File)
          $files+=@(Get-ChildItem 'ansible/files/wslpe45/*.psm1' -File)
          $files+=@(Get-Item 'scripts/wslpe41-learner-pilot21-readonly.ps1')
          foreach($file in $files) {
              $tokens=$null; $errors=$null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
              if(@($errors).Count) { $errors | ForEach-Object {Write-Output $_}; throw $file.Name }
          }
          Write-Output '[PASS] Native PS5.1 parse; no fixture installed'
      - name: Test owned active RPC coexistence decisions without guest access
        shell: powershell
        run: ./tests/test_wslpe45_rpc_coexistence.ps1
      - name: Test default registry value transport under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Requires Windows PowerShell 5.1'}
          $inputJson='{"registry":[{"values":[{"name":"","kind":"String","value":"default-data"},{"name":"CodeBase","kind":"String","value":"file:///C:/owned.DLL"}]}]}'
          $decoded=$inputJson | ConvertFrom-Json -ErrorAction Stop
          $entries=@($decoded.registry[0].values)
          if($entries.Count -ne 2){throw 'Decoded registry entry count changed'}
          if([string]$entries[0].name -cne '' -or
             [string]$entries[0].kind -cne 'String' -or
             [string]$entries[0].value -cne 'default-data' -or
             [string]$entries[1].name -cne 'CodeBase'){
              throw 'PS5.1 default value or named value lost'
          }
          Write-Output '[PASS] Native PS5.1 registry default name transported as data'
      - name: Test native stderr under Windows PowerShell 5.1
        shell: powershell
        run: ./tests/test_wslpe45_regasm_process.ps1
      - name: Compile remaining sources and exercise pipe denial and timeout
        shell: powershell
        run: ./tests/test_wslpe45_remaining_native.ps1
      - name: Compile protected updater consumer without execution
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source=Get-Content 'ansible/files/wslpe45/KingdomServiceConsumer.cs' -Raw
          Add-Type -TypeDefinition $source -ReferencedAssemblies 'System.ServiceProcess.dll' -OutputAssembly "$env:RUNNER_TEMP/Consumer.exe" -OutputType WindowsApplication -ErrorAction Stop
          Write-Output '[PASS] .NET Framework compile; no service or payload execution'
