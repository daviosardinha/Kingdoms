name: WSLPE41 fresh-install source regression

on:
  push:
    branches: [feature/wslpe45-single-candidate-pilot]
  pull_request:
    paths:
      - 'scripts/wslpe-acceptance.py'
      - 'scripts/wslpe-fast-track-20.py'
      - 'kingdoms/wslpe_*.py'
      - 'tests/test_wslpe_*.py'
      - 'ansible/wslpe-*.yml'
      - 'ansible/wslpe45/**'
      - 'ansible/roles/windows_lpe/**'
      - 'ad/WSLPE/**'
      - '.github/workflows/wslpe41-fresh-install-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    name: Entire WSLPE offline source regression (no guest)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml 'ansible-core==2.17.14'
      - name: Run the exact 343-test fresh-install source gate
        run: |
          python -m unittest discover -s tests -p 'test_wslpe_*.py' -v
      - name: State scope of proof
        run: |
          echo '[PASS] WSLPE offline source suite finished'
          echo '[NOT PROVEN] VMware creation, guest provisioning, 41 scenario deployment, learner escalation'
