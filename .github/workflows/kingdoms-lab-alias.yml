name: KINGDOMS public lab alias

on:
  push:
    branches:
      - feature/kingdoms-public-lab-alias
  pull_request:
    paths:
      - goad/lab_names.py
      - goad_nomad.py
      - goad/settings.py
      - goad/infos.py
      - tests/test_kingdoms_lab_alias.py
      - .github/workflows/kingdoms-lab-alias.yml

permissions:
  contents: read

jobs:
  alias-source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the changed Python source
        run: python -m py_compile goad/lab_names.py goad_nomad.py goad/settings.py goad/infos.py tests/test_kingdoms_lab_alias.py
      - name: Verify both spellings without VMware
        run: python -m unittest tests.test_kingdoms_lab_alias -v
