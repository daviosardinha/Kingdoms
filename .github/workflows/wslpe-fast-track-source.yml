name: WSLPE fast-track source regression

on:
  push:
    branches:
      - feature/windows-lpe-standalone-foundation
    paths:
      - '.github/workflows/wslpe-fast-track-source.yml'
      - 'scripts/wslpe-fast-track-20.py'
      - 'kingdoms/wslpe_fast_track_resume.py'
      - 'kingdoms/wslpe_learner_credentials.py'
      - 'tests/test_wslpe_fast_track_20.py'
      - 'tests/test_wslpe_fast_track_resume.py'
      - 'tests/test_wslpe_learner_credentials.py'
      - 'tests/test_wslpe_operator_shell_safety.py'
      - 'tests/test_wslpe_aie_profile_preflight.py'
      - 'tests/test_wslpe_aie_reset_adapter.py'
      - 'ansible/wslpe-aie-reset-tasks.yml'
      - 'ansible/wslpe-lpe-test.yml'
      - 'ansible/wslpe-always-install-elevated-preflight.yml'
      - 'docs/WSLPE_20_TECHNIQUE_FAST_TRACK.md'
      - 'ansible/roles/windows_lpe/defaults/main.yml'
  pull_request:
    paths:
      - '.github/workflows/wslpe-fast-track-source.yml'
      - 'scripts/wslpe-fast-track-20.py'
      - 'kingdoms/wslpe_fast_track_resume.py'
      - 'kingdoms/wslpe_learner_credentials.py'
      - 'tests/test_wslpe_fast_track_20.py'
      - 'tests/test_wslpe_fast_track_resume.py'
      - 'tests/test_wslpe_learner_credentials.py'
      - 'tests/test_wslpe_operator_shell_safety.py'
      - 'tests/test_wslpe_aie_profile_preflight.py'
      - 'tests/test_wslpe_aie_reset_adapter.py'
      - 'ansible/wslpe-aie-reset-tasks.yml'
      - 'ansible/wslpe-lpe-test.yml'
      - 'ansible/wslpe-always-install-elevated-preflight.yml'
      - 'docs/WSLPE_20_TECHNIQUE_FAST_TRACK.md'
      - 'ansible/roles/windows_lpe/defaults/main.yml'

permissions:
  contents: read

jobs:
  source-only:
    name: Compile and regression test WSLPE (no VM)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Install Ansible playbook syntax dependencies
        run: |
          python -m pip install --disable-pip-version-check 'ansible-core>=2.18,<2.20'
          ansible-galaxy collection install ansible.windows
      - name: Syntax check WSLPE-only profile preparation
        run: |
          printf '[wslpe]\nws01 ansible_connection=local\n[windows_lpe_standalone]\nws01\n' > "$RUNNER_TEMP/wslpe-ci-inventory"
          ansible-playbook -i "$RUNNER_TEMP/wslpe-ci-inventory" --syntax-check \
            ansible/wslpe-always-install-elevated-preflight.yml
          ansible-playbook -i "$RUNNER_TEMP/wslpe-ci-inventory" --syntax-check \
            ansible/wslpe-lpe-test.yml
      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/wslpe-fast-track-20.py \
            kingdoms/wslpe_fast_track_resume.py \
            kingdoms/wslpe_learner_credentials.py \
            tests/test_wslpe_fast_track_20.py \
            tests/test_wslpe_fast_track_resume.py \
            tests/test_wslpe_learner_credentials.py \
            tests/test_wslpe_operator_shell_safety.py \
            tests/test_wslpe_aie_profile_preflight.py \
            tests/test_wslpe_aie_reset_adapter.py
      - name: Run read-only source and negative-path regressions
        run: |
          python -m unittest -v \
            tests.test_wslpe_fast_track_20 \
            tests.test_wslpe_fast_track_resume \
            tests.test_wslpe_learner_credentials \
            tests.test_wslpe_operator_shell_safety \
            tests.test_wslpe_aie_profile_preflight \
            tests.test_wslpe_aie_reset_adapter

  windows-native-export:
    name: Verify userenv CreateProfile symbol (Windows, no guest)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse embedded WSLPE registry reset PowerShell on native Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pyyaml
          @'
          import os
          from pathlib import Path
          import yaml
          source = Path('ansible/wslpe-aie-reset-tasks.yml')
          tasks = yaml.safe_load(source.read_text(encoding='utf-8'))
          output = Path(os.environ['RUNNER_TEMP']) / 'wslpe-reset-powershell'
          output.mkdir(parents=True, exist_ok=True)
          for i, task in enumerate(tasks):
              settings = task.get('ansible.windows.win_powershell')
              if settings:
                  (output / f'reset-task-{i}.ps1').write_text(
                      settings['script'], encoding='utf-8')
          assert len(list(output.glob('*.ps1'))) == 2
          '@ | python -
          $scripts = Get-ChildItem "$env:RUNNER_TEMP/wslpe-reset-powershell/*.ps1"
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              foreach ($errorItem in $errors) { Write-Error $errorItem.Message }
              throw "PowerShell syntax failed: $($script.Name)"
            }
            Write-Host "[PASS] Native Windows PowerShell AST parsed $($script.Name)"
          }
      - name: Exercise the actual AIE device-path guard against Windows' loaded user hive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import os
          from pathlib import Path
          import yaml
          tasks = yaml.safe_load(Path('ansible/wslpe-aie-reset-tasks.yml').read_text(encoding='utf-8'))
          source = tasks[0]['ansible.windows.win_powershell']['script']
          marker = "              $hiveList = Get-ItemProperty"
          start = source.index(marker)
          end = source.index("\n          }\n          else {", start)
          block = source[start:end]
          assert block.count("'\\REGISTRY\\USER\\KingdomAIE'") == 1
          block = block.replace(
              "'\\REGISTRY\\USER\\KingdomAIE'",
              "('\\REGISTRY\\USER\\' + $sid)")
          header = """
          $ErrorActionPreference = 'Stop'
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $ntuser = Join-Path $env:USERPROFILE 'NTUSER.DAT'
          """
          footer = """
          if (-not [string]::Equals($hiveValue, $expectedHive,
                                      [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Actual Windows hivelist/native path canonicalization mismatch'
          }
          Write-Host '[PASS] WSLPE device path guard matches live Windows hivelist'
          """
          path = Path(os.environ['RUNNER_TEMP']) / 'wslpe-native-hive-guard.ps1'
          path.write_text(header + block + footer, encoding='utf-8')
          '@ | python -
          & "$env:RUNNER_TEMP/wslpe-native-hive-guard.ps1"
      - name: Check actual userenv.dll entry point without creating a user profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content 'ansible/wslpe-always-install-elevated-preflight.yml' -Raw
          if ($source -notmatch 'EntryPoint = "CreateProfile", ExactSpelling = true') {
            throw 'WSLPE preflight does not use the verified native entry point'
          }
          $code = @'
          using System;
          using System.Runtime.InteropServices;
          public static class WslpeExportCheck {
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode,
                         ExactSpelling=true, EntryPoint="LoadLibraryW")]
              public static extern IntPtr LoadLibrary(string name);
              [DllImport("kernel32.dll", CharSet=CharSet.Ansi,
                         ExactSpelling=true, EntryPoint="GetProcAddress")]
              public static extern IntPtr GetProcAddress(IntPtr module, string name);
              [DllImport("kernel32.dll", ExactSpelling=true, EntryPoint="FreeLibrary")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          Add-Type -TypeDefinition $code -ErrorAction Stop
          $handle = [WslpeExportCheck]::LoadLibrary('userenv.dll')
          if ($handle -eq [IntPtr]::Zero) {
            throw 'Could not load userenv.dll'
          }
          try {
            $actual = [WslpeExportCheck]::GetProcAddress($handle, 'CreateProfile')
            if ($actual -eq [IntPtr]::Zero) {
              throw 'userenv.dll does not export CreateProfile'
            }
            Write-Host '[PASS] Windows userenv.dll exports CreateProfile'
          }
          finally {
            [void][WslpeExportCheck]::FreeLibrary($handle)
          }
