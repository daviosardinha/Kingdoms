name: NORTH release source and validator regression

on:
  pull_request:
    paths:
      - '.github/workflows/north-release-source-gate.yml'
      - 'scripts/validate-north-all.sh'
      - 'scripts/validate-course1.sh'
      - 'scripts/validate-phase02-readiness.sh'
      - 'scripts/validate-phase03-readiness.sh'
      - 'scripts/lab-mode.sh'
      - 'tests/test_north_*.py'
      - 'tests/test_course1_*.py'
      - 'tests/test_lab_mode_ad_readiness.py'
      - 'tests/test_course1_validation_orchestrator.py'
      - 'goad/course1_*.py'
      - 'goad/provider/vagrant/vmware_kingdoms.py'
      - 'ansible/kingdoms-time-backoff.yml'
      - 'ad/NORTH/**'
  push:
    branches:
      - fix/north-guarded-offline-release

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10' 'PyYAML>=6,<7' 'Jinja2>=3.1,<4' 'rich>=13,<15' 'pywinrm>=0.5,<1'
      - name: Parse NORTH shell entrypoints
        run: |
          bash -n scripts/lab-mode.sh
          bash -n scripts/validate-course1.sh
          bash -n scripts/validate-north-all.sh
      - name: NORTH source, provider and lifecycle unit regressions
        run: |
          python -m pytest -q \
            tests/test_north_*.py \
            tests/test_course1_*.py \
            tests/test_lab_mode_ad_readiness.py \
            tests/test_course1_validation_orchestrator.py
      - name: State the live-validation boundary
        run: |
          echo 'NORTH_SOURCE_CI=PASS'
          echo 'NORTH_VMWARE_RUNTIME=NOT_TESTED'
          echo 'NORTH_PHASE03_ATTACK_EXECUTION=NOT_TESTED'
          echo 'NORTH_LPE_LIVE_STATE=NOT_TESTED'
