name: WSLPE 45 standalone source contract

on:
  push:
    branches: ['feature/windows-lpe-45-batch']
  pull_request:
    paths:
      - 'kingdoms/wslpe_batch_catalog.py'
      - 'kingdoms/wslpe_expert_catalog.yml'
      - 'kingdoms/wslpe_batch_feasibility.py'
      - 'ansible/wslpe-45-feasibility.yml'
      - 'scripts/wslpe-45-batch.py'
      - 'scripts/wslpe-45-feasibility.py'
      - 'tests/test_wslpe_batch_catalog.py'
      - 'tests/test_wslpe_batch_feasibility.py'
      - 'kingdoms/wslpe45_implementation_index.yml'
      - 'kingdoms/wslpe45_batch_operator.py'
      - 'scripts/wslpe-45-qualify.py'
      - 'tests/test_wslpe45_batch_operator.py'
      - 'tests/test_wslpe45_registry_trust.py'
      - 'tests/test_wslpe45_candidate_traversal.py'
      - 'ansible/files/wslpe45/**'
      - 'ansible/wslpe45/**'
      - '.github/workflows/wslpe-45-batch-source.yml'

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Validate Python, all 45 unique IDs, frozen NORTH and exact-guest negative paths
        run: |
          python -m py_compile kingdoms/wslpe_batch_catalog.py kingdoms/wslpe_batch_feasibility.py scripts/wslpe-45-batch.py scripts/wslpe-45-feasibility.py tests/test_wslpe_batch_catalog.py tests/test_wslpe_batch_feasibility.py
          python -m unittest -v tests.test_wslpe_advanced_catalog tests.test_wslpe_batch_catalog tests.test_wslpe_batch_feasibility tests.test_wslpe45_candidate_traversal tests.test_wslpe45_batch_operator tests.test_wslpe45_registry_trust
          python scripts/wslpe-45-batch.py
          python scripts/wslpe-45-feasibility.py
          python scripts/wslpe-45-qualify.py
          if python scripts/wslpe-45-qualify.py --execute; then
            echo 'ERROR: Incomplete 25-fixture batch must refuse guest execution'
            false
          else
            echo '[PASS] Incomplete batch correctly fails closed before guest contact'
          fi

  windows-native-syntax:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact read-only PowerShell script
        shell: pwsh
        run: |
          python -m pip install pyyaml
          @'
          import os
          from pathlib import Path
          import yaml
          plays = yaml.safe_load(Path("ansible/wslpe-45-feasibility.yml").read_text(encoding="utf-8"))
          assert len(plays) == 2
          source = plays[1]["tasks"][0]["ansible.windows.win_powershell"]["script"]
          assert source.count("native_api_blocked") == 1
          assert source.count("WSLPE_45_FEASIBILITY_B64=") == 1
          Path(os.environ["RUNNER_TEMP"], "wslpe-45-feasibility.ps1").write_text(source, encoding="utf-8-sig")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract native WSLPE script' }
      - name: Parse exact script with Windows PowerShell 5.1 AST
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'wslpe-45-feasibility.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'WSLPE 45 guest script fails Windows PowerShell syntax'
          }
          Write-Output '[PASS] Windows PowerShell 5.1 native parse, no guest contacted'
      - name: Parse #35 PowerShell source and ownership module without guest access
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import yaml
          play = yaml.safe_load(Path("ansible/wslpe45/traversal.yml").read_text(encoding="utf-8"))
          assert len(play) == 2
          target = Path(os.environ["RUNNER_TEMP"]) / "wslpe45-traversal-source"
          target.mkdir(exist_ok=True)
          scripts = []
          for item in (play[1].get("pre_tasks", []) + play[1].get("tasks", [])):
              src = item.get("ansible.windows.win_powershell", {}).get("script")
              if src:
                  scripts.append(src)
          assert len(scripts) >= 5
          for i, source in enumerate(scripts):
              (target / f"task-{i}.ps1").write_text(source, encoding="utf-8-sig")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw '#35 script extraction failed' }
          $sources = @(
            Get-Item -LiteralPath 'ansible/files/wslpe45/WslpeFixture.psm1'
          ) + @(
            Get-ChildItem -Path "$env:RUNNER_TEMP/wslpe45-traversal-source/*.ps1"
          )
          if ($sources.Count -lt 7) {
            throw "Expected ownership module and six PowerShell scripts, found $($sources.Count)"
          }
          foreach ($entry in $sources) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $entry.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Windows PowerShell 5.1 parsing failed: $($entry.Name)"
            }
          }
          Write-Output "[PASS] Parsed fixture library and $($sources.Count) #35 PowerShell scripts"
      - name: Compile the real #35 service on Windows, without installing it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content 'ansible/files/wslpe45/KingdomTraversalService.cs' -Raw
          $output = Join-Path $env:RUNNER_TEMP 'KingdomWslpe45TraversalSvc.exe'
          Add-Type -TypeDefinition $source -Language CSharp -ReferencedAssemblies 'System.ServiceProcess.dll' -OutputAssembly $output -OutputType WindowsApplication
          if (-not (Test-Path -LiteralPath $output)) {
            throw 'Standalone service compilation failed'
          }
          Write-Output '[PASS] Isolated Windows LPE #35 service compiles; no service installed'

      - name: Parse independent #26/#28 Windows PowerShell 5.1 source
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import re
          import yaml
          temp = Path(os.environ["RUNNER_TEMP"]) / "wslpe45-registry-candidates"
          temp.mkdir(exist_ok=True)
          module = Path("ansible/files/wslpe45/WslpeRegistryTrust.psm1").read_text(encoding="utf-8")
          for number, name in ((26,"ifeo_debugger_acl_hijack"),(28,"app_paths_registry_hijack")):
              plays = yaml.safe_load(Path(f"ansible/wslpe45/{name}.yml").read_text(encoding="utf-8"))
              assert len(plays) == 2
              assert plays[0]["hosts"] == "localhost" and plays[1]["hosts"] == "wslpe"
              for i, item in enumerate(plays[1]["pre_tasks"] + plays[1]["tasks"]):
                  script = item.get("ansible.windows.win_powershell",{}).get("script")
                  if script:
                      (temp / f"{number}-{i}.ps1").write_text(script, encoding="utf-8-sig")
          cs = (
              ("benign",r"(?s)\$benign\s*=\s*@'\s*\n(.*?)\n'@"),
              ("proof",r'(?s)\$proofCode\s*=\s*@"\s*\n(.*?)\n"@'),
              ("launcher",r"(?s)\$launcherCode\s*=\s*@'\s*\n(.*?)\n'@"),
          )
          for name, pattern in cs:
              found = re.search(pattern, module)
              assert found, f"Missing {name} CSharp source"
              (temp / f"{name}.cs").write_text(found.group(1), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Failed extracting registry fixture scripts' }
          $folder = Join-Path $env:RUNNER_TEMP 'wslpe45-registry-candidates'
          $sources = @((Get-Item 'ansible/files/wslpe45/WslpeRegistryTrust.psm1')) +
            @(Get-ChildItem -Path (Join-Path $folder '*.ps1'))
          if ($sources.Count -lt 7) { throw "Insufficient registry fixture script coverage: $($sources.Count)" }
          foreach ($source in $sources) {
            $tok = $null; $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $source.FullName,[ref]$tok,[ref]$err)
            if ($err.Count -ne 0) {
              $err | ForEach-Object { Write-Error $_.Message }
              throw "Windows PowerShell syntax: $($source.FullName)"
            }
          }
          Write-Output "[PASS] Registry source parses: $($sources.Count) exact Windows scripts"
      - name: Compile isolated registry trust binaries without installing services or tasks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'wslpe45-registry-candidates'
          foreach ($name in @('benign','proof','launcher')) {
            $source = Get-Content (Join-Path $folder "$name.cs") -Raw
            $output = Join-Path $folder "$name.exe"
            Add-Type -TypeDefinition $source -Language CSharp -OutputAssembly $output -OutputType ConsoleApplication
            if (-not (Test-Path -LiteralPath $output)) { throw "Missing compiled $name fixture" }
          }
          Write-Output '[PASS] Three registry trust binaries compile on native Windows without deployment'
