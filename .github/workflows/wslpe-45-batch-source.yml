name: WSLPE 45 standalone source contract

on:
  push:
    branches: ['feature/windows-lpe-45-batch']
  pull_request:
    paths:
      - 'kingdoms/wslpe_batch_catalog.py'
      - 'kingdoms/wslpe_expert_catalog.yml'
      - 'kingdoms/wslpe_batch_feasibility.py'
      - 'ansible/wslpe-45-feasibility.yml'
      - 'scripts/wslpe-45-batch.py'
      - 'scripts/wslpe-45-feasibility.py'
      - 'tests/test_wslpe_batch_catalog.py'
      - 'tests/test_wslpe_batch_feasibility.py'
      - 'kingdoms/wslpe45_implementation_index.yml'
      - 'kingdoms/wslpe45_batch_operator.py'
      - 'scripts/wslpe-45-qualify.py'
      - 'tests/test_wslpe45_batch_operator.py'
      - 'tests/test_wslpe45_registry_trust.py'
      - 'tests/test_wslpe45_task_definition_acl.py'
      - 'tests/test_wslpe45_lsa_rights.py'
      - 'tests/test_wslpe45_scm_create_acl.py'
      - 'tests/test_wslpe45_service_consumers.py'
      - 'tests/test_wslpe45_library_lockdown.py'
      - 'tests/test_wslpe45_boundary_services.py'
      - 'tests/test_wslpe45_candidate_traversal.py'
      - 'ansible/files/wslpe45/**'
      - 'ansible/wslpe45/**'
      - '.github/workflows/wslpe-45-batch-source.yml'

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Validate Python, all 45 unique IDs, frozen NORTH and exact-guest negative paths
        run: |
          python -m py_compile kingdoms/wslpe_batch_catalog.py kingdoms/wslpe_batch_feasibility.py scripts/wslpe-45-batch.py scripts/wslpe-45-feasibility.py tests/test_wslpe_batch_catalog.py tests/test_wslpe_batch_feasibility.py
          python -m unittest -v tests.test_wslpe_advanced_catalog tests.test_wslpe_batch_catalog tests.test_wslpe_batch_feasibility tests.test_wslpe45_candidate_traversal tests.test_wslpe45_batch_operator tests.test_wslpe45_registry_trust tests.test_wslpe45_task_definition_acl tests.test_wslpe45_lsa_rights tests.test_wslpe45_scm_create_acl tests.test_wslpe45_service_consumers tests.test_wslpe45_library_lockdown tests.test_wslpe45_boundary_services
          python scripts/wslpe-45-batch.py
          python scripts/wslpe-45-feasibility.py
          python scripts/wslpe-45-qualify.py
          if python scripts/wslpe-45-qualify.py --execute; then
            echo 'ERROR: Incomplete 25-fixture batch must refuse guest execution'
            false
          else
            echo '[PASS] Incomplete batch correctly fails closed before guest contact'
          fi

  windows-native-syntax:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact read-only PowerShell script
        shell: pwsh
        run: |
          python -m pip install pyyaml
          @'
          import os
          from pathlib import Path
          import yaml
          plays = yaml.safe_load(Path("ansible/wslpe-45-feasibility.yml").read_text(encoding="utf-8"))
          assert len(plays) == 2
          source = plays[1]["tasks"][0]["ansible.windows.win_powershell"]["script"]
          assert source.count("native_api_blocked") == 1
          assert source.count("WSLPE_45_FEASIBILITY_B64=") == 1
          Path(os.environ["RUNNER_TEMP"], "wslpe-45-feasibility.ps1").write_text(source, encoding="utf-8-sig")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract native WSLPE script' }
      - name: Parse exact script with Windows PowerShell 5.1 AST
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'wslpe-45-feasibility.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'WSLPE 45 guest script fails Windows PowerShell syntax'
          }
          Write-Output '[PASS] Windows PowerShell 5.1 native parse, no guest contacted'
      - name: Parse #35 PowerShell source and ownership module without guest access
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import yaml
          play = yaml.safe_load(Path("ansible/wslpe45/traversal.yml").read_text(encoding="utf-8"))
          assert len(play) == 2
          target = Path(os.environ["RUNNER_TEMP"]) / "wslpe45-traversal-source"
          target.mkdir(exist_ok=True)
          scripts = []
          for item in (play[1].get("pre_tasks", []) + play[1].get("tasks", [])):
              src = item.get("ansible.windows.win_powershell", {}).get("script")
              if src:
                  scripts.append(src)
          assert len(scripts) >= 5
          for i, source in enumerate(scripts):
              (target / f"task-{i}.ps1").write_text(source, encoding="utf-8-sig")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw '#35 script extraction failed' }
          $sources = @(
            Get-Item -LiteralPath 'ansible/files/wslpe45/WslpeFixture.psm1'
          ) + @(
            Get-ChildItem -Path "$env:RUNNER_TEMP/wslpe45-traversal-source/*.ps1"
          )
          if ($sources.Count -lt 7) {
            throw "Expected ownership module and six PowerShell scripts, found $($sources.Count)"
          }
          foreach ($entry in $sources) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $entry.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Windows PowerShell 5.1 parsing failed: $($entry.Name)"
            }
          }
          Write-Output "[PASS] Parsed fixture library and $($sources.Count) #35 PowerShell scripts"
      - name: Compile the real #35 service on Windows, without installing it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content 'ansible/files/wslpe45/KingdomTraversalService.cs' -Raw
          $output = Join-Path $env:RUNNER_TEMP 'KingdomWslpe45TraversalSvc.exe'
          Add-Type -TypeDefinition $source -Language CSharp -ReferencedAssemblies 'System.ServiceProcess.dll' -OutputAssembly $output -OutputType WindowsApplication
          if (-not (Test-Path -LiteralPath $output)) {
            throw 'Standalone service compilation failed'
          }
          Write-Output '[PASS] Isolated Windows LPE #35 service compiles; no service installed'

      - name: Parse independent #26/#28 Windows PowerShell 5.1 source
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import re
          import yaml
          temp = Path(os.environ["RUNNER_TEMP"]) / "wslpe45-registry-candidates"
          temp.mkdir(exist_ok=True)
          module = Path("ansible/files/wslpe45/WslpeRegistryTrust.psm1").read_text(encoding="utf-8")
          for number, name in ((26,"ifeo_debugger_acl_hijack"),(28,"app_paths_registry_hijack")):
              plays = yaml.safe_load(Path(f"ansible/wslpe45/{name}.yml").read_text(encoding="utf-8"))
              assert len(plays) == 2
              assert plays[0]["hosts"] == "localhost" and plays[1]["hosts"] == "wslpe"
              for i, item in enumerate(plays[1]["pre_tasks"] + plays[1]["tasks"]):
                  script = item.get("ansible.windows.win_powershell",{}).get("script")
                  if script:
                      (temp / f"{number}-{i}.ps1").write_text(script, encoding="utf-8-sig")
          cs = (
              ("benign",r"(?s)\$benign\s*=\s*@'\s*\n(.*?)\n'@"),
              ("proof",r'(?s)\$proofCode\s*=\s*@"\s*\n(.*?)\n"@'),
              ("launcher",r"(?s)\$launcherCode\s*=\s*@'\s*\n(.*?)\n'@"),
          )
          for name, pattern in cs:
              found = re.search(pattern, module)
              assert found, f"Missing {name} CSharp source"
              (temp / f"{name}.cs").write_text(found.group(1), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Failed extracting registry fixture scripts' }
          $folder = Join-Path $env:RUNNER_TEMP 'wslpe45-registry-candidates'
          $sources = @((Get-Item 'ansible/files/wslpe45/WslpeRegistryTrust.psm1')) +
            @(Get-ChildItem -Path (Join-Path $folder '*.ps1'))
          if ($sources.Count -lt 7) { throw "Insufficient registry fixture script coverage: $($sources.Count)" }
          foreach ($source in $sources) {
            $tok = $null; $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $source.FullName,[ref]$tok,[ref]$err)
            if ($err.Count -ne 0) {
              $err | ForEach-Object { Write-Error $_.Message }
              throw "Windows PowerShell syntax: $($source.FullName)"
            }
          }
          Write-Output "[PASS] Registry source parses: $($sources.Count) exact Windows scripts"
      - name: Compile isolated registry trust binaries without installing services or tasks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'wslpe45-registry-candidates'
          foreach ($name in @('benign','proof','launcher')) {
            $source = Get-Content (Join-Path $folder "$name.cs") -Raw
            $output = Join-Path $folder "$name.exe"
            Add-Type -TypeDefinition $source -Language CSharp -OutputAssembly $output -OutputType ConsoleApplication
            if (-not (Test-Path -LiteralPath $output)) { throw "Missing compiled $name fixture" }
          }
          Write-Output '[PASS] Three registry trust binaries compile on native Windows without deployment'

      - name: Parse standalone #21 native Task Scheduler scripts
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import yaml
          play = yaml.safe_load(Path("ansible/wslpe45/scheduled_task_definition_acl.yml").read_text(encoding="utf-8"))
          assert len(play) == 2
          assert [p["hosts"] for p in play] == ["localhost","wslpe"]
          root=Path(os.environ["RUNNER_TEMP"]) / "wslpe45-task21"
          root.mkdir(exist_ok=True)
          scripts = []
          for entry in play[1]["pre_tasks"] + play[1]["tasks"]:
              body=entry.get("ansible.windows.win_powershell",{}).get("script")
              if body:
                  scripts.append(body)
          assert len(scripts) == 2
          for i, source in enumerate(scripts):
              (root / f"task-{i}.ps1").write_text(source,encoding="utf-8-sig")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract exact task definition ACL Windows source' }
          $files = @(Get-ChildItem -Path "$env:RUNNER_TEMP/wslpe45-task21/*.ps1")
          foreach($file in $files) {
            $tokens = $null; $issues = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,[ref]$tokens,[ref]$issues)
            if($issues.Count -ne 0) {
              $issues | ForEach-Object { Write-Error $_.Message }
              throw "Task definition script syntax failed: $($file.Name)"
            }
          }
          Write-Output "[PASS] Task Scheduler DACL source parsed on Windows PowerShell 5.1"

      - name: Parse and compile three standalone LSA rights fixture sources
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import re
          import yaml
          folder=Path(os.environ["RUNNER_TEMP"]) / "wslpe45-lsa-rights"
          folder.mkdir(exist_ok=True)
          src=Path("ansible/files/wslpe45/WslpeLsaRights.psm1").read_text(encoding="utf-8")
          snippets=[
              ("lsa",r"(?s)Add-Type -TypeDefinition @'\s*\n(.*?)\n'@ -Language CSharp"),
              ("service",r"(?s)\$serviceCode=@'\s*\n(.*?)\n'@"),
          ]
          for name,expression in snippets:
              match=re.search(expression,src)
              assert match, f"Missing distinct {name} native source"
              (folder/f"{name}.cs").write_text(match.group(1),encoding="utf-8")
          for number,name in ((31,"setakeownership_privilege"),(32,"serestore_privilege"),(33,"sedebug_privilege")):
              plays=yaml.safe_load(Path(f"ansible/wslpe45/{name}.yml").read_text(encoding="utf-8"))
              assert [p["hosts"] for p in plays]==["localhost","wslpe"]
              for i,item in enumerate(plays[1]["pre_tasks"]+plays[1]["tasks"]):
                  script=item.get("ansible.windows.win_powershell",{}).get("script")
                  if script:
                      (folder/f"{number}-{i}.ps1").write_text(script,encoding="utf-8-sig")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'LSA fixture source extraction failed' }
          $sources=@(Get-Item 'ansible/files/wslpe45/WslpeLsaRights.psm1') +
            @(Get-ChildItem -Path "$env:RUNNER_TEMP/wslpe45-lsa-rights/*.ps1")
          if ($sources.Count -lt 7) { throw 'Missing native LSA scripts' }
          foreach ($path in $sources) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Native LSA PowerShell 5.1 source parsing failed: $($path.Name)"
            }
          }
          Write-Output "[PASS] All $($sources.Count) standalone LSA PowerShell scripts parse"
      - name: Compile scoped LSA PInvoke and non-PPL debug service on Windows
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'wslpe45-lsa-rights'
          $lsa=Get-Content -LiteralPath (Join-Path $root 'lsa.cs') -Raw
          Add-Type -TypeDefinition $lsa -Language CSharp -OutputAssembly (Join-Path $root 'lsa.dll')
          if(-not (Test-Path -LiteralPath (Join-Path $root 'lsa.dll'))) {
            throw 'Native account-right PInvoke source failed compilation'
          }
          $service=Get-Content -LiteralPath (Join-Path $root 'service.cs') -Raw
          Add-Type -TypeDefinition $service -Language CSharp -ReferencedAssemblies 'System.ServiceProcess.dll' -OutputAssembly (Join-Path $root 'debug-target.exe') -OutputType WindowsApplication
          if(-not (Test-Path -LiteralPath (Join-Path $root 'debug-target.exe'))) {
            throw 'Standalone debug service CSharp source failed compilation'
          }
          Write-Output '[PASS] Native LSA right helper and SYSTEM test service build without deployment'

      - name: Native SCM DACL snapshot and restore script parsing
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import yaml
          plays=yaml.safe_load(Path("ansible/wslpe45/scm_create_service_acl.yml").read_text(encoding="utf-8"))
          assert len(plays)==2
          assert [x["hosts"] for x in plays]==["localhost","wslpe"]
          out=Path(os.environ["RUNNER_TEMP"])/"wslpe45-scm"
          out.mkdir(exist_ok=True)
          scripts=[]
          for item in plays[1]["pre_tasks"]+plays[1]["tasks"]:
              script=item.get("ansible.windows.win_powershell",{}).get("script")
              if script: scripts.append(script)
          assert len(scripts)>=2
          for n,code in enumerate(scripts):
              (out/f"scm-{n}.ps1").write_text(code,encoding="utf-8-sig")
          '@ | python -
          if($LASTEXITCODE -ne 0) { throw 'Cannot extract standalone SCM scripts' }
          foreach($path in @(Get-ChildItem "$env:RUNNER_TEMP/wslpe45-scm/*.ps1")) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "SCM DACL source failed Windows PowerShell 5.1 parse: $($path.Name)"
            }
          }
          Write-Output '[PASS] WSLPE-only SCM SDDL source parsed without guest access'

      - name: Parse custom privileged consumer Playbooks and Windows module
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import yaml
          target=Path(os.environ["RUNNER_TEMP"]) / "wslpe45-service-consumers"
          target.mkdir(exist_ok=True)
          for number,id in ((23,"privileged_service_config_injection"),
                            (24,"privileged_updater_hijack"),
                            (41,"privileged_argument_injection")):
              plays=yaml.safe_load(Path(f"ansible/wslpe45/{id}.yml").read_text(encoding="utf-8"))
              assert [p["hosts"] for p in plays]==["localhost","wslpe"]
              scripts=[]
              for item in plays[1]["pre_tasks"]+plays[1]["tasks"]:
                  body=item.get("ansible.windows.win_powershell",{}).get("script")
                  if body:scripts.append(body)
              assert len(scripts)>=2
              for idx,script in enumerate(scripts):
                  (target/f"{number}-{idx}.ps1").write_text(script,encoding="utf-8-sig")
          '@ | python -
          if($LASTEXITCODE -ne 0) { throw 'Custom service consumer script extraction failed' }
          $sources=@(Get-Item 'ansible/files/wslpe45/WslpeServiceConsumer.psm1') +
            @(Get-ChildItem "$env:RUNNER_TEMP/wslpe45-service-consumers/*.ps1")
          if ($sources.Count -lt 7) { throw 'Missing service-consumer source scripts' }
          foreach($file in $sources) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Windows PowerShell 5.1 service source parsing failed: $($file.Name)"
            }
          }
          Write-Output '[PASS] Distinct service-consumer PowerShell scripts parse'
      - name: Compile custom service consumer on native Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source=Get-Content -LiteralPath 'ansible/files/wslpe45/KingdomServiceConsumer.cs' -Raw
          $binary=Join-Path $env:RUNNER_TEMP 'KingdomServiceConsumer.exe'
          Add-Type -TypeDefinition $source -Language CSharp -ReferencedAssemblies 'System.ServiceProcess.dll' -OutputAssembly $binary -OutputType WindowsApplication
          if(-not (Test-Path -LiteralPath $binary)) {
            throw 'Custom service CSharp source did not produce binary'
          }
          $child = Get-Content -LiteralPath 'ansible/files/wslpe45/Kingdom45EnvironmentChild.cs' -Raw
          $childOutput = Join-Path $env:RUNNER_TEMP 'Kingdom45EnvironmentChild.exe'
          Add-Type -TypeDefinition $child -Language CSharp -OutputAssembly $childOutput -OutputType ConsoleApplication
          if (!(Test-Path -LiteralPath $childOutput -PathType Leaf)) { throw 'Environment child build failed' }
          Write-Output '[PASS] Four source-only service-consumer modes and fixed environment child compile'


      - name: Parse common exact-guest library lockdown task on Windows PowerShell 5.1
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import yaml
          tasks=yaml.safe_load(Path("ansible/wslpe45/lockdown-library.yml").read_text(encoding="utf-8"))
          assert len(tasks)==1
          source=tasks[0]["ansible.windows.win_powershell"]["script"]
          Path(os.environ["RUNNER_TEMP"],"wslpe45-library-lockdown.ps1").write_text(
              source,encoding="utf-8-sig")
          '@ | python -
          if($LASTEXITCODE -ne 0) { throw 'Failed extracting privileged script ACL protections' }
          $source=Join-Path $env:RUNNER_TEMP 'wslpe45-library-lockdown.ps1'
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $source,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'WSLPE library ACL lockdown failed Windows PowerShell 5.1 syntax'
          }
          Write-Output '[PASS] Shared elevated fixture library lockdown syntax is valid'
      - name: Parse and compile isolated boundary service candidates
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'ansible/files/wslpe45/KingdomBoundaryService.cs'
          $dll = Join-Path $env:RUNNER_TEMP 'KingdomBoundaryService.exe'
          Add-Type -TypeDefinition (Get-Content -LiteralPath $src -Raw) -Language CSharp -ReferencedAssemblies @('System.ServiceProcess.dll','System.Core.dll') -OutputAssembly $dll -OutputType WindowsApplication
          if (!(Test-Path -LiteralPath $dll -PathType Leaf)) { throw 'Boundary service did not compile' }
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'ansible/files/wslpe45/WslpeBoundary.psm1'),
            [ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { throw 'Boundary PowerShell module has syntax errors' }
          $pluginSrc = Get-Content -LiteralPath 'ansible/files/wslpe45/Kingdom45Plugin.cs' -Raw
          $pluginDll = Join-Path $env:RUNNER_TEMP 'Kingdom45Plugin.dll'
          Add-Type -TypeDefinition $pluginSrc -Language CSharp -OutputAssembly $pluginDll -OutputType Library
          if (!(Test-Path -LiteralPath $pluginDll -PathType Leaf)) { throw 'Managed plugin build failed' }
          Write-Output '[PASS] Native boundary service, management module, and managed plugin compile'

