name: NORTH WS01 KingdomProof source regression

on:
  push:
    branches:
      - main
      - fix/north-ws01-kingdomproof-provision
    paths:
      - ansible/build.yml
      - ansible/roles/settings/north_kingdom_proof/**
      - tests/test_north_kingdom_proof_source.py
      - .github/workflows/north-kingdom-proof.yml
  pull_request:
    paths:
      - ansible/build.yml
      - ansible/roles/settings/north_kingdom_proof/**
      - tests/test_north_kingdom_proof_source.py
      - .github/workflows/north-kingdom-proof.yml

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: NORTH WS01 provisioning source contract
        run: python -m unittest -v tests.test_north_kingdom_proof_source
      - name: Parse NORTH Ansible build and proof role YAML
        run: |
          python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7.0"
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in (
              "ansible/build.yml",
              "ansible/roles/settings/north_kingdom_proof/tasks/main.yml",
          ):
              data = yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              assert isinstance(data, list) and data, name
              print("YAML OK:", name)
          PY
