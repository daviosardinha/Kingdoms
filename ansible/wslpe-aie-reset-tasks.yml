---
# WSLPE-only AlwaysInstallElevated rollback. Do NOT edit the shared NORTH role.
# Called only from the standalone WSLPE adapter for one exact reset action.
#
# Key difference from the original NORTH role: all PowerShell registry
# provider handles are released BEFORE a *separate* win_command task
# attempts reg.exe unload. The snapshot persists until the reset finishes.
- name: Restore exact WSLPE AIE registry values without unloading hive yet
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $system = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
      if ($system.PartOfDomain -or $env:COMPUTERNAME -ne 'WSLPE-WS01') {
          throw 'AIE reset refused: guest is not exact standalone WSLPE-WS01'
      }
      $learner = Get-LocalUser -Name 'lpe.trainee' -ErrorAction Stop
      if (-not $learner.Enabled) { throw 'AIE reset refused: learner disabled' }
      $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
      $adminSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-544')
      $principal = New-Object System.Security.Principal.WindowsPrincipal($identity)
      if (-not $principal.IsInRole($adminSid)) { throw 'AIE reset requires an elevated provisioning session' }
      $localAdmins = Get-LocalGroup -SID $adminSid -ErrorAction Stop
      if (@(Get-LocalGroupMember -Group $localAdmins.Name |
              Where-Object { $_.SID.Value -eq $learner.SID.Value }).Count -gt 0) {
          throw 'AIE reset refused: learner has administrator membership'
      }

      $root = 'C:\Kingdom LPE\AlwaysInstallElevated'
      $snapshot = Join-Path $root 'state.json'
      if (-not (Test-Path -LiteralPath $snapshot -PathType Leaf)) {
          throw 'AIE state snapshot missing: do not guess original registry values'
      }
      foreach ($path in @($root, $snapshot)) {
          $item = Get-Item -LiteralPath $path -Force -ErrorAction Stop
          if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'AIE state includes a reparse point; refusing reset'
          }
      }
      $state = Get-Content -LiteralPath $snapshot -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
      $sid = $learner.SID.Value
      $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
      $profile = [Environment]::ExpandEnvironmentVariables(
          (Get-ItemProperty -LiteralPath $profileKey -ErrorAction Stop).ProfileImagePath)
      if ($state.sid -ne $sid -or
          -not [string]::Equals([string]$state.profile, $profile,
                               [StringComparison]::OrdinalIgnoreCase)) {
          throw 'AIE snapshot does not belong to the exact local WSLPE learner'
      }
      $ntuser = Join-Path $profile 'NTUSER.DAT'
      if (-not (Test-Path -LiteralPath $ntuser -PathType Leaf)) {
          throw 'AIE reset refused: learner registry hive file missing'
      }

      $machinePath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      # The shared role has already backed up these values into state.json.
      # Never invent defaults or assume that HKLM/HKCU were previously absent.
      if ([bool]$state.machine_value_exists) {
          New-Item -Path $machinePath -Force | Out-Null
          New-ItemProperty -LiteralPath $machinePath -Name AlwaysInstallElevated -Value ([int]$state.machine_value) -PropertyType DWord -Force | Out-Null
      }
      else {
          Remove-ItemProperty -LiteralPath $machinePath -Name AlwaysInstallElevated -ErrorAction SilentlyContinue
          if (-not [bool]$state.machine_key_exists -and (Test-Path -LiteralPath $machinePath)) {
              $machine = Get-Item -LiteralPath $machinePath
              if ($machine.Property.Count -eq 0 -and $machine.SubKeyCount -eq 0) {
                  $machine.Close()
                  $machine = $null
                  Remove-Item -LiteralPath $machinePath -Force
              }
              else {
                  $machine.Close()
                  $machine = $null
              }
          }
      }

      # If the original learner hive was loaded, never unmount their SID.
      # The original NORTH role uses "KingdomAIE" for temporary mounts.
      $loadedSID = Test-Path -LiteralPath "Registry::HKEY_USERS\$sid"
      $mount = if ($loadedSID) { $sid } else { 'KingdomAIE' }
      if (-not $loadedSID) {
          $alreadyMounted = Test-Path -LiteralPath 'Registry::HKEY_USERS\KingdomAIE'
          if ($alreadyMounted) {
              # A stale mount from the failed shared-role reset is expected,
              # but never unload a foreign process's unrelated registry hive.
              # Windows Hivelist values use native NT device paths rather
              # than DOS drive-letter paths. Never compare a DOS-only suffix
              # or accept a foreign mounted hive.
              $hiveList = Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\hivelist' -ErrorAction Stop
              $record = @($hiveList.PSObject.Properties | Where-Object { $_.Name -ieq '\REGISTRY\USER\KingdomAIE' })
              if ($record.Count -ne 1 -or -not [string]$record[0].Value) {
                  throw 'AIE temporary registry mount has no unique hive identity record'
              }
              $profileHive = Get-Item -LiteralPath $ntuser -Force -ErrorAction Stop
              if (($profileHive.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                  throw 'AIE learner hive is a reparse point'
              }
              $rootDrive = [IO.Path]::GetPathRoot($ntuser).TrimEnd('\')
              if ($rootDrive -notmatch '^[A-Za-z]:$') {
                  throw 'AIE learner hive must have an exact local drive-letter path'
              }
              $native = @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class WslpeAieDosDevice {
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode,
                         EntryPoint="QueryDosDeviceW", ExactSpelling=true,
                         SetLastError=true)]
              public static extern uint QueryDosDevice(
                  string device, StringBuilder path, int capacity);
          }
      '@
              Add-Type -TypeDefinition $native -ErrorAction Stop
              $buffer = New-Object System.Text.StringBuilder(4096)
              $count = [WslpeAieDosDevice]::QueryDosDevice(
                  $rootDrive, $buffer, $buffer.Capacity)
              if ($count -eq 0) {
                  throw 'AIE learner volume cannot be resolved to an NT device path'
              }
              $volume = $buffer.ToString().Split([char]0)[0].TrimEnd('\')
              if (-not $volume.StartsWith('\Device\', [StringComparison]::OrdinalIgnoreCase)) {
                  throw 'AIE learner volume identity is not a local NT device'
              }
              $suffix = $ntuser.Substring($rootDrive.Length).TrimStart('\')
              $expectedHive = $volume + '\' + $suffix
              $hiveValue = ([string]$record[0].Value).TrimEnd([char]0)
              if (-not [string]::Equals(
                  $hiveValue, $expectedHive, [StringComparison]::OrdinalIgnoreCase)) {
                  throw 'AIE temporary registry mount does not map to the exact learner NTUSER.DAT'
              }
          }
          else {
              & reg.exe load "HKU\$mount" "$ntuser" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'AIE registry hive could not be loaded for restoration' }
          }
      }

      # All HKCU changes are completed HERE. A separate Ansible task will
      # unload after the current PowerShell process exits and releases keys.
      $userPath = "Registry::HKEY_USERS\$mount\Software\Policies\Microsoft\Windows\Installer"
      if ([bool]$state.user_value_exists) {
          New-Item -Path $userPath -Force | Out-Null
          New-ItemProperty -LiteralPath $userPath -Name AlwaysInstallElevated -Value ([int]$state.user_value) -PropertyType DWord -Force | Out-Null
      }
      else {
          Remove-ItemProperty -LiteralPath $userPath -Name AlwaysInstallElevated -ErrorAction SilentlyContinue
          if (-not [bool]$state.user_key_exists -and (Test-Path -LiteralPath $userPath)) {
              $userKey = Get-Item -LiteralPath $userPath
              if ($userKey.Property.Count -eq 0 -and $userKey.SubKeyCount -eq 0) {
                  $userKey.Close()
                  $userKey = $null
                  Remove-Item -LiteralPath $userPath -Force
              }
              else {
                  $userKey.Close()
                  $userKey = $null
              }
          }
      }
      if ([bool]$state.user_value_exists) {
          $actual = Get-ItemProperty -LiteralPath $userPath -Name AlwaysInstallElevated -ErrorAction Stop
          if ([int]$actual.AlwaysInstallElevated -ne [int]$state.user_value) {
              throw 'AIE user registry value did not restore to snapshot'
          }
      }
      else {
          $actual = Get-ItemProperty -LiteralPath $userPath -Name AlwaysInstallElevated -ErrorAction SilentlyContinue
          if ($null -ne $actual) { throw 'AIE user registry value still exists' }
      }

      $Ansible.Result = @{
          temporary_hive = (-not $loadedSID)
          snapshot_verified = $true
      }
      $Ansible.Changed = $true
      Write-Output 'WSLPE_AIE_REGISTRY_SNAPSHOT_RESTORED=TRUE'
  register: wslpe_aie_restore

- name: Require verified WSLPE AIE registry restoration
  ansible.builtin.assert:
    that:
      - wslpe_aie_restore.result.snapshot_verified | default(false) | bool
    fail_msg: "WSLPE AIE reset cannot continue without verified snapshot restoration"

- name: Unload temporary learner registry hive in a separate process
  ansible.windows.win_command:
    argv:
      - reg.exe
      - unload
      - HKU\KingdomAIE
  register: wslpe_aie_unload
  when: wslpe_aie_restore.result.temporary_hive | default(false) | bool

- name: Finalize the exact standalone WSLPE AIE snapshot cleanup
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $system = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
      if ($system.PartOfDomain -or $env:COMPUTERNAME -ne 'WSLPE-WS01') {
          throw 'AIE finalization refused: wrong machine identity'
      }
      $root = 'C:\Kingdom LPE\AlwaysInstallElevated'
      $stateFile = Join-Path $root 'state.json'
      if (-not (Test-Path -LiteralPath $stateFile -PathType Leaf)) {
          throw 'AIE finalization refused: snapshot missing'
      }
      $directory = Get-Item -LiteralPath $root -Force -ErrorAction Stop
      if (($directory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
          throw 'AIE finalization refused: reparse-point directory'
      }
      $entries = @(Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop)
      if ($entries.Count -ne 1 -or $entries[0].Name -ne 'state.json' -or
          ($entries[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
          throw 'AIE finalization refused: unexpected contents'
      }
      $saved = Get-Content -LiteralPath $stateFile -Raw | ConvertFrom-Json
      $machine = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer' -Name AlwaysInstallElevated -ErrorAction SilentlyContinue
      if ([bool]$saved.machine_value_exists) {
          if ($null -eq $machine -or [int]$machine.AlwaysInstallElevated -ne [int]$saved.machine_value) {
              throw 'AIE HKLM value not restored to original'
          }
      }
      elseif ($null -ne $machine) {
          throw 'AIE HKLM value still exists after restoration'
      }
      Remove-Item -LiteralPath $stateFile -Force -ErrorAction Stop
      Remove-Item -LiteralPath $root -Force -ErrorAction Stop
      Write-Output 'WSLPE_AIE_RESET=PASS'
  register: wslpe_aie_reset_final
