---
# WSLPE ONLY: reconcile the two existing NORTH user-right fixtures against
# authoritative LSA policy. The shared NORTH role is strictly unchanged.
# This also handles the partial SeBackup apply already recorded on WSLPE.
- name: Exercise exact standalone WSLPE learner right via LSA
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $selected = '{{ wslpe_techniques[0] }}'
      $action = '{{ wslpe_action }}'
      $expected = '{{ windows_lpe_validate_state | default("none") }}'
      $mapping = @{
          sebackup_privilege = 'SeBackupPrivilege'
          seimpersonate_privilege = 'SeImpersonatePrivilege'
      }
      if (-not $mapping.ContainsKey($selected) -or $action -notin @('apply','reset','validate')) {
          throw 'WSLPE rights adapter refuses unknown technique or action'
      }
      if ($action -eq 'validate' -and $expected -notin @('vulnerable','clean')) {
          throw 'WSLPE rights validation requires an explicit expected state'
      }
      $right = $mapping[$selected]
      $root = Join-Path 'C:\Kingdom LPE\User Rights' $right
      $stateFile = Join-Path $root 'state.json'
      $hostInfo = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
      if ($hostInfo.PartOfDomain -or $env:COMPUTERNAME -ne 'WSLPE-WS01') {
          throw 'WSLPE rights adapter refused a domain-joined or foreign guest'
      }
      $learner = Get-LocalUser -Name 'lpe.trainee' -ErrorAction Stop
      if (-not $learner.Enabled) { throw 'WSLPE local learner is disabled' }
      $sid = $learner.SID.Value
      $target = 'WSLPE-WS01\lpe.trainee'
      $adminsId = [Security.Principal.SecurityIdentifier]::new('S-1-5-32-544')
      $admins = Get-LocalGroup -SID $adminsId -ErrorAction Stop
      if (@(Get-LocalGroupMember -Group $admins.Name -ErrorAction Stop |
          Where-Object { $_.SID.Value -eq $sid }).Count -ne 0) {
          throw 'WSLPE learner must not belong to Administrators'
      }
      if ($action -ne 'validate') {
          $principal = [Security.Principal.WindowsPrincipal]::new(
              [Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole($adminsId)) {
              throw 'WSLPE rights mutation requires an elevated operator context'
          }
      }

      Add-Type -TypeDefinition @'
      using System;
      using System.ComponentModel;
      using System.Runtime.InteropServices;
      using System.Security.Principal;
      public static class WslpeDirectAccountRights {
          [StructLayout(LayoutKind.Sequential)]
          struct LSA_OBJECT_ATTRIBUTES {
              public int Length;
              public IntPtr RootDirectory;
              public IntPtr ObjectName;
              public uint Attributes;
              public IntPtr SecurityDescriptor;
              public IntPtr SecurityQualityOfService;
          }
          [StructLayout(LayoutKind.Sequential)]
          struct LSA_UNICODE_STRING {
              public ushort Length;
              public ushort MaximumLength;
              public IntPtr Buffer;
          }
          const uint LOOKUP_NAMES = 0x00000800;
          const uint CREATE_ACCOUNT = 0x00000010;
          [DllImport("advapi32.dll", ExactSpelling=true)]
          static extern uint LsaOpenPolicy(IntPtr host,
              ref LSA_OBJECT_ATTRIBUTES attrs, uint access, out IntPtr policy);
          [DllImport("advapi32.dll", ExactSpelling=true)]
          static extern uint LsaEnumerateAccountRights(IntPtr policy,
              IntPtr accountSid, out IntPtr rights, out uint count);
          [DllImport("advapi32.dll", ExactSpelling=true)]
          static extern uint LsaAddAccountRights(IntPtr policy,
              IntPtr accountSid, [In] LSA_UNICODE_STRING[] rights, uint count);
          [DllImport("advapi32.dll", ExactSpelling=true)]
          static extern uint LsaRemoveAccountRights(IntPtr policy,
              IntPtr accountSid, bool allRights, [In] LSA_UNICODE_STRING[] rights, uint count);
          [DllImport("advapi32.dll", ExactSpelling=true)]
          static extern uint LsaNtStatusToWinError(uint status);
          [DllImport("advapi32.dll", ExactSpelling=true)]
          static extern uint LsaClose(IntPtr policy);
          [DllImport("advapi32.dll", ExactSpelling=true)]
          static extern uint LsaFreeMemory(IntPtr buffer);

          static void EnsureSuccess(uint code, string stage) {
              if (code != 0)
                  throw new Win32Exception((int)LsaNtStatusToWinError(code),
                      "WSLPE LSA " + stage + " failed");
          }
          static IntPtr AllocateSid(string text) {
              var sid = new SecurityIdentifier(text);
              var bytes = new byte[sid.BinaryLength];
              sid.GetBinaryForm(bytes, 0);
              var ptr = Marshal.AllocHGlobal(bytes.Length);
              Marshal.Copy(bytes, 0, ptr, bytes.Length);
              return ptr;
          }
          static IntPtr Open(uint access) {
              var attrs = new LSA_OBJECT_ATTRIBUTES();
              attrs.Length = Marshal.SizeOf(typeof(LSA_OBJECT_ATTRIBUTES));
              IntPtr policy;
              EnsureSuccess(LsaOpenPolicy(IntPtr.Zero, ref attrs, access, out policy), "open");
              return policy;
          }
          public static bool HasRight(string sid, string wantedRight) {
              IntPtr sidPtr = IntPtr.Zero, policy = IntPtr.Zero, rightBuffer = IntPtr.Zero;
              try {
                  sidPtr = AllocateSid(sid);
                  policy = Open(LOOKUP_NAMES);
                  uint count = 0;
                  uint status = LsaEnumerateAccountRights(policy, sidPtr, out rightBuffer, out count);
                  if (status != 0) {
                      uint error = LsaNtStatusToWinError(status);
                      if (error == 2) return false; // Account has no direct rights.
                      EnsureSuccess(status, "enumeration");
                  }
                  int size = Marshal.SizeOf(typeof(LSA_UNICODE_STRING));
                  for (uint i = 0; i < count; i++) {
                      var right = (LSA_UNICODE_STRING)Marshal.PtrToStructure(
                          IntPtr.Add(rightBuffer, checked((int)i * size)),
                          typeof(LSA_UNICODE_STRING));
                      string value = Marshal.PtrToStringUni(right.Buffer, right.Length / 2);
                      if (String.Equals(value, wantedRight, StringComparison.OrdinalIgnoreCase))
                          return true;
                  }
                  return false;
              } finally {
                  if (rightBuffer != IntPtr.Zero) LsaFreeMemory(rightBuffer);
                  if (policy != IntPtr.Zero) LsaClose(policy);
                  if (sidPtr != IntPtr.Zero) Marshal.FreeHGlobal(sidPtr);
              }
          }
          public static void Change(string sid, string rightName, bool remove) {
              IntPtr sidPtr = IntPtr.Zero, policy = IntPtr.Zero, rightPtr = IntPtr.Zero;
              try {
                  sidPtr = AllocateSid(sid);
                  policy = Open(LOOKUP_NAMES | CREATE_ACCOUNT);
                  rightPtr = Marshal.StringToHGlobalUni(rightName);
                  var right = new LSA_UNICODE_STRING {
                      Buffer = rightPtr,
                      Length = checked((ushort)(rightName.Length * 2)),
                      MaximumLength = checked((ushort)((rightName.Length + 1) * 2))
                  };
                  uint status = remove
                      ? LsaRemoveAccountRights(policy, sidPtr, false, new [] {right}, 1)
                      : LsaAddAccountRights(policy, sidPtr, new [] {right}, 1);
                  EnsureSuccess(status, remove ? "remove" : "add");
              } finally {
                  if (rightPtr != IntPtr.Zero) Marshal.FreeHGlobal(rightPtr);
                  if (policy != IntPtr.Zero) LsaClose(policy);
                  if (sidPtr != IntPtr.Zero) Marshal.FreeHGlobal(sidPtr);
              }
          }
      }
      '@

      $Ansible.Changed = $false
      if (Test-Path -LiteralPath $root) {
          $rootItem = Get-Item -LiteralPath $root -Force -ErrorAction Stop
          if (-not $rootItem.PSIsContainer -or
              ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'WSLPE user-right fixture root is untrusted'
          }
      }
      if (Test-Path -LiteralPath $stateFile) {
          $fileItem = Get-Item -LiteralPath $stateFile -Force -ErrorAction Stop
          if ($fileItem.PSIsContainer -or
              ($fileItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'WSLPE user-right snapshot is untrusted'
          }
          $saved = Get-Content -LiteralPath $stateFile -Raw -ErrorAction Stop |
              ConvertFrom-Json -ErrorAction Stop
          if ($saved.target -cne $target -or $saved.sid -cne $sid -or
              $saved.right -cne $right -or
              $null -eq $saved.preexisting) {
              throw 'WSLPE user-right snapshot does not match exact learner/SID/right'
          }
          if ([bool]$saved.preexisting) {
              throw 'WSLPE fixture cannot reset or seed a pre-existing account right'
          }
      }
      else {
          $saved = $null
      }

      $present = [WslpeDirectAccountRights]::HasRight($sid, $right)
      if ($action -eq 'apply') {
          if ($null -eq $saved) {
              if ($present -or (Test-Path -LiteralPath $root)) {
                  throw 'Untracked existing account right or fixture directory: refusing apply'
              }
              New-Item -ItemType Directory -Path $root -Force -ErrorAction Stop | Out-Null
              [pscustomobject]@{
                  target = $target
                  sid = $sid
                  right = $right
                  preexisting = $false
              } | ConvertTo-Json | Set-Content -LiteralPath $stateFile -Encoding UTF8 -ErrorAction Stop
              $Ansible.Changed = $true
          }
          if (-not $present) {
              [WslpeDirectAccountRights]::Change($sid, $right, $false)
              $Ansible.Changed = $true
          }
          if (-not [WslpeDirectAccountRights]::HasRight($sid, $right)) {
              throw 'WSLPE LSA direct privilege assignment failed verification'
          }
          Write-Output "WSLPE_USER_RIGHT_APPLIED=$right"
      }
      elseif ($action -eq 'reset') {
          if ($null -eq $saved) {
              throw 'Cannot restore WSLPE user right without exact original state snapshot'
          }
          $entries = @(Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop)
          if ($entries.Count -ne 1 -or $entries[0].Name -ne 'state.json' -or
              ($entries[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Unexpected WSLPE user-right fixture contents; refusing cleanup'
          }
          if ($present) {
              [WslpeDirectAccountRights]::Change($sid, $right, $true)
              $Ansible.Changed = $true
          }
          if ([WslpeDirectAccountRights]::HasRight($sid, $right)) {
              throw 'WSLPE LSA direct right remained after reset'
          }
          Remove-Item -LiteralPath $stateFile -Force -ErrorAction Stop
          Remove-Item -LiteralPath $root -Force -ErrorAction Stop
          $Ansible.Changed = $true
          Write-Output "WSLPE_USER_RIGHT_RESET=$right"
      }
      else {
          if ($expected -eq 'vulnerable') {
              if ($null -eq $saved -or -not $present) {
                  throw 'WSLPE direct LSA state does not validate as vulnerable'
              }
          }
          else {
              if ($null -ne $saved -or $present -or (Test-Path -LiteralPath $root)) {
                  throw 'WSLPE direct LSA state does not validate as clean'
              }
          }
          Write-Output "WSLPE_USER_RIGHT_VALIDATED=$right/$expected"
      }
  changed_when: wslpe_action in ['apply', 'reset']
