---
- name: Restore exact WS01 WPAD network baseline
  hosts: ws01
  gather_facts: false
  vars:
    phase03_wpad_baseline_path: "{{ lookup('env','HOME') }}/.config/kingdoms/phase03-wpad-baseline.json"
    phase03_wpad_baseline: "{{ lookup('ansible.builtin.file', phase03_wpad_baseline_path) | from_json }}"
  tasks:
    - name: Release malicious DHCPv6 state and restore baseline DNS on WS01
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false

          $baselineAlias = '{{ phase03_wpad_baseline.InterfaceAlias }}'
          $baselineIndex = [int]'{{ phase03_wpad_baseline.InterfaceIndex }}'

          $cfg = Get-NetIPConfiguration -InterfaceIndex $baselineIndex -ErrorAction Stop
          if ([string]$cfg.InterfaceAlias -ne $baselineAlias) {
              throw "WPAD baseline interface identity changed: expected $baselineAlias/$baselineIndex, got $($cfg.InterfaceAlias)/$($cfg.InterfaceIndex)"
          }

          $baselineDns = @(
              '{{ phase03_wpad_baseline.IPv6DnsServers | join('|||') }}'.Split('|||') |
                  Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) } |
                  Sort-Object -Unique
          )

          # mitm6 injects its address and DNS through DHCPv6. Releasing the
          # DHCPv6 lease removes that attacker-owned state while leaving IPv4
          # and the native link-local address untouched.
          $release = Start-Process \
              -FilePath "$env:SystemRoot\System32\ipconfig.exe" \
              -ArgumentList @('/release6', $baselineAlias) \
              -NoNewWindow \
              -PassThru \
              -Wait

          Write-Output "PHASE03_WPAD_RESTORE_RELEASE6_RC=$($release.ExitCode)"
          $Ansible.Changed = $true

          # Restore only IPv6 DNS. Do not use Set-DnsClientServerAddress
          # -ResetServerAddresses here because that is broader than the WPAD
          # rollback contract and may also affect IPv4 DNS on the interface.
          if ($baselineDns.Count -eq 0) {
              $dnsReset = Start-Process \
                  -FilePath "$env:SystemRoot\\System32\\netsh.exe" \
                  -ArgumentList @(
                      'interface','ipv6','set','dnsservers',
                      "name=$baselineAlias",
                      'source=dhcp'
                  ) \
                  -NoNewWindow \
                  -PassThru \
                  -Wait

              if ($dnsReset.ExitCode -ne 0) {
                  throw "IPv6 DNS reset failed with rc=$($dnsReset.ExitCode)"
              }

              Write-Output "PHASE03_WPAD_RESTORE_DNSV6_MODE=dhcp"
          }
          else {
              $first = $baselineDns[0]
              $dnsSet = Start-Process \
                  -FilePath "$env:SystemRoot\\System32\\netsh.exe" \
                  -ArgumentList @(
                      'interface','ipv6','set','dnsservers',
                      "name=$baselineAlias",
                      "address=$first",
                      'validate=no'
                  ) \
                  -NoNewWindow \
                  -PassThru \
                  -Wait

              if ($dnsSet.ExitCode -ne 0) {
                  throw "IPv6 DNS baseline set failed with rc=$($dnsSet.ExitCode)"
              }

              for ($i = 1; $i -lt $baselineDns.Count; $i++) {
                  $dnsAdd = Start-Process \
                      -FilePath "$env:SystemRoot\\System32\\netsh.exe" \
                      -ArgumentList @(
                          'interface','ipv6','add','dnsservers',
                          "name=$baselineAlias",
                          "address=$($baselineDns[$i])",
                          "index=$($i + 1)",
                          'validate=no'
                      ) \
                      -NoNewWindow \
                      -PassThru \
                      -Wait

                  if ($dnsAdd.ExitCode -ne 0) {
                      throw "IPv6 DNS baseline add failed with rc=$($dnsAdd.ExitCode)"
                  }
              }

              Write-Output "PHASE03_WPAD_RESTORE_DNSV6_MODE=static"
          }

          Start-Sleep -Seconds 2

          Write-Output "PHASE03_WPAD_RESTORE_INTERFACE=$baselineAlias"
          Write-Output "PHASE03_WPAD_RESTORE_BASELINE_DNSV6_COUNT=$($baselineDns.Count)"
          Write-Output "PHASE03_WPAD_RESTORE_MUTATION_COMPLETE=True"
      register: restore

    - name: Emit WPAD restore mutation markers
      ansible.builtin.debug:
        msg: "{{ restore.output | default([]) }}"
      changed_when: false
