---
# NORTH Phase 04 Topic 07.
# A Windows-owned maintenance process starts the vulnerable service regularly.
# The student's user can inspect the task but cannot start it on demand.
# We do not grant Rickon SERVICE_START or modify the service security descriptor.

- name: NORTH | register recurring workstation maintenance task
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $taskName = 'Workstation Service Health'
      $scheduler = New-Object -ComObject 'Schedule.Service'
      $scheduler.Connect()
      $folder = $scheduler.GetFolder('\')
      $registered = $null
      try { $registered = $folder.GetTask($taskName) } catch { $registered = $null }

      # Reapply only when the managed task no longer matches the intended contract.
      $needsRegistration = $true
      if ($null -ne $registered) {
          $definition = $registered.Definition
          if ($definition.Actions.Count -eq 1 -and $definition.Triggers.Count -eq 1) {
              $action = $definition.Actions.Item(1)
              $trigger = $definition.Triggers.Item(1)
              $principal = $definition.Principal
              $settings = $definition.Settings
              $matches = (
                  $action.Path -ieq 'C:\Windows\System32\sc.exe' -and
                  $action.Arguments -eq 'start KingdomBinarySvc' -and
                  $trigger.Type -eq 2 -and
                  $trigger.DaysInterval -eq 1 -and
                  $trigger.Repetition.Interval -eq 'PT1M' -and
                  $trigger.Repetition.Duration -eq 'P1D' -and
                  $principal.UserId -in @('SYSTEM', 'NT AUTHORITY\SYSTEM', 'S-1-5-18') -and
                  $principal.LogonType -eq 5 -and
                  $settings.Enabled -and
                  -not $settings.Hidden -and
                  -not $settings.AllowDemandStart -and
                  $settings.MultipleInstances -eq 2
              )
              $needsRegistration = -not $matches
          }
      }
      if ($needsRegistration) {
          $definition = $scheduler.NewTask(0)
          $definition.RegistrationInfo.Description = 'Check locally installed workstation services on a regular schedule'
          $definition.RegistrationInfo.Author = 'NORTH Workstation Maintenance'
          $definition.Principal.UserId = 'SYSTEM'
          $definition.Principal.LogonType = 5
          $definition.Principal.RunLevel = 1
          $definition.Settings.Compatibility = 4
          $definition.Settings.Enabled = $true
          $definition.Settings.Hidden = $false
          $definition.Settings.AllowDemandStart = $false
          $definition.Settings.DisallowStartIfOnBatteries = $false
          $definition.Settings.StopIfGoingOnBatteries = $false
          $definition.Settings.StartWhenAvailable = $true
          $definition.Settings.MultipleInstances = 2
          $trigger = $definition.Triggers.Create(2)
          $trigger.StartBoundary = '2026-01-01T00:00:00'
          $trigger.DaysInterval = 1
          $trigger.Repetition.Interval = 'PT1M'
          $trigger.Repetition.Duration = 'P1D'
          $trigger.Repetition.StopAtDurationEnd = $false
          $action = $definition.Actions.Create(0)
          $action.Path = 'C:\Windows\System32\sc.exe'
          $action.Arguments = 'start KingdomBinarySvc'
          $acl = 'D:P(A;;FA;;;SY)(A;;FA;;;BA)(A;;GR;;;BU)'
          $folder.RegisterTaskDefinition($taskName, $definition, 6, 'SYSTEM', $null, 5, $acl) | Out-Null
          $Ansible.Changed = $true
      }
      else {
          $Ansible.Changed = $false
      }
      Write-Output 'NORTH_TOPIC07_MAINTENANCE_REGISTERED'

# Task Scheduler permissions: BUILTIN\Users may read the task definition
# (so students can discover its action and schedule), but must not be able
# to execute, modify or delete the task. Administrators and SYSTEM retain
# full control. Idempotent comparison avoids rewriting an unchanged DACL.
- name: NORTH | expose read-only task details to standard users
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $scheduler = New-Object -ComObject 'Schedule.Service'
      $scheduler.Connect()
      $registered = $scheduler.GetFolder('\').GetTask('Workstation Service Health')
      $desired = 'D:P(A;;FA;;;SY)(A;;FA;;;BA)(A;;GR;;;BU)'
      $actual = $registered.GetSecurityDescriptor(4)
      $section = [System.Security.AccessControl.AccessControlSections]::Access
      $actualDacl = (New-Object System.Security.AccessControl.RawSecurityDescriptor($actual)).GetSddlForm($section)
      $desiredDacl = (New-Object System.Security.AccessControl.RawSecurityDescriptor($desired)).GetSddlForm($section)
      if ($actualDacl -ne $desiredDacl) {
          $registered.SetSecurityDescriptor($desired, 0)
          $Ansible.Changed = $true
      }
      else {
          $Ansible.Changed = $false
      }
      $verified = $registered.GetSecurityDescriptor(4)
      $verifiedDacl = (New-Object System.Security.AccessControl.RawSecurityDescriptor($verified)).GetSddlForm($section)
      if ($verifiedDacl -ne $desiredDacl) {
          throw 'NORTH maintenance task read-only ACL verification failed'
      }
      Write-Output 'NORTH_TOPIC07_MAINTENANCE_ACL_READY'

- name: NORTH | verify scheduled maintenance contract without starting the service
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $name = 'Workstation Service Health'
      $task = Get-ScheduledTask -TaskName $name -ErrorAction Stop
      [xml]$definition = Export-ScheduledTask -TaskName $name -ErrorAction Stop
      if ($task.State -eq 'Disabled') { throw 'NORTH maintenance task is disabled' }
      if ($task.Principal.UserId -notin @('SYSTEM', 'NT AUTHORITY\SYSTEM', 'S-1-5-18')) {
          throw "NORTH maintenance principal unexpected: $($task.Principal.UserId)"
      }
      if ($task.Settings.AllowDemandStart) {
          throw 'NORTH maintenance task unexpectedly allows manual start'
      }
      $exec = $definition.SelectSingleNode("//*[local-name()='Actions']/*[local-name()='Exec']/*[local-name()='Command']")
      $arguments = $definition.SelectSingleNode("//*[local-name()='Actions']/*[local-name()='Exec']/*[local-name()='Arguments']")
      $interval = $definition.SelectSingleNode("//*[local-name()='Repetition']/*[local-name()='Interval']")
      if (-not $exec -or $exec.InnerText -ne 'C:\Windows\System32\sc.exe') {
          throw 'NORTH maintenance task executable is incorrect'
      }
      if (-not $arguments -or $arguments.InnerText -ne 'start KingdomBinarySvc') {
          throw 'NORTH maintenance task action is incorrect'
      }
      if (-not $interval -or $interval.InnerText -ne 'PT1M') {
          throw 'NORTH maintenance task repetition must be one minute'
      }
      $Ansible.Changed = $false
      Write-Output 'NORTH_TOPIC07_MAINTENANCE_READY|principal=SYSTEM|interval=PT1M|service=KingdomBinarySvc'
  changed_when: false
