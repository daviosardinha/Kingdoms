- name: Ensure DNS Server service is running
  ansible.windows.win_service:
    name: DNS
    start_mode: auto
    state: started

- name: enable the {{domain_adapter}} interface (local) for DNS client requests
  ansible.windows.win_shell: dnscmd . /resetlistenaddresses {{ hostvars[dict_key].ansible_host }}
  when: two_adapters

- name: Validate the child AD-integrated DNS zone
  ansible.windows.win_powershell:
    script: |
      param (
          [String]
          $ZoneName
      )

      $Ansible.Changed = $false
      $zone = Get-DnsServerZone -Name $ZoneName -ErrorAction Stop
      if (-not $zone.IsDsIntegrated) {
          throw "Child DNS zone '$ZoneName' exists but is not Active Directory integrated"
      }
    parameters:
      ZoneName: "{{domain}}"
  register: child_dns_zone
  retries: 6
  delay: 20
  until: child_dns_zone is succeeded

- name: Check for xDnsServer Powershell module
  win_psmodule:
    name: xDnsServer
    state: present

# add external dns forwarder
- name: Configure DNS Forwarders
  win_dsc:
    resource_name: xDnsServerForwarder
    IsSingleInstance: "yes"
    UseRootHint: false
    IPAddresses:
      - "{{dns_server_forwarder}}"

- name: Install ActiveDirectoryDSC from PSGallery
  win_psmodule:
    name: ActiveDirectoryDSC
    repository: PSGallery
    required_version: "6.7.1"
    state: present
  register: active_directory_dsc_install
  retries: 5
  delay: 30
  until: active_directory_dsc_install is succeeded

# Orange-Cyberdefense/GOAD issue #156 documents intermittent child-DC ADWS
# startup failures. Setting only StartupType is not enough for a running lab,
# so GOAD_NOMAD makes the service state explicit and idempotent.
- name: Ensure Active Directory Web Services is enabled and running
  ansible.windows.win_service:
    name: ADWS
    start_mode: auto
    state: started