- name: "disable the registration of the {{nat_adapter}} interface (NAT address) in DNS"
  ansible.windows.win_shell: Get-NetAdapter '{{nat_adapter}}' | Set-DNSClient -RegisterThisConnectionsAddress $False
  when: two_adapters

- name: "disable IPv6 binding on the {{nat_adapter}} provisioning interface"
  ansible.windows.win_powershell:
    script: |
      param (
          [String]
          $AdapterName
      )

      $binding = Get-NetAdapterBinding -Name $AdapterName -ComponentID ms_tcpip6 -ErrorAction Stop
      if ($binding.Enabled) {
          Disable-NetAdapterBinding -Name $AdapterName -ComponentID ms_tcpip6 -Confirm:$false -ErrorAction Stop
          $Ansible.Changed = $true
      } else {
          $Ansible.Changed = $false
      }
    parameters:
      AdapterName: "{{nat_adapter}}"
  when: two_adapters

- name: "Set configure dns to {{dns_domain}}"
  win_dns_client:
    adapter_names: "{{domain_adapter}}"
    ipv4_addresses:
      - "{{hostvars[dns_domain].ansible_host}}"
    log_path: C:\dns_log.txt

- name: Install windows features - AD Domain Services
  win_feature:
    name: AD-Domain-Services
    state: present
    include_management_tools: yes
  register: features

- name: Install windows features - RSAT-ADDS
  win_feature:
    name: RSAT-ADDS
    state: present
    include_management_tools: yes
  register: features

# Orange-Cyberdefense/GOAD issue #157 documents child-DC failures where
# dnscmd.exe is absent. GOAD_NOMAD requires the DNS role and management tools
# before promotion because the segmented topology later binds DNS explicitly to
# the exercise NIC.
- name: Install windows features - DNS Server and management tools
  win_feature:
    name: DNS
    state: present
    include_management_tools: yes
  register: dns_features

# The legacy reference GOAD child-domain role is intentionally preserved.
# NORTH reuses the same DNS namespace as a separately running GOAD forest:
# protect both adapters and prove an instance-local DC Locator before promotion.
- name: Guard NORTH child promotion against foreign VMware NAT DNS
  ansible.builtin.include_tasks: north_dns_containment.yml
  when: domain_name | default('') == 'NORTH'

# DNSCHANGE
# - name: "disable interface {{nat_adapter}} before join domain"
#   win_shell: netsh interface set interface "{{nat_adapter}}" disable

- name: add child domain to parent domain
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String]
          $Password,

          [String]
          $DomainAdmin,

          [String]
          $ParentDomainName,

          [String]
          $NewDomainNetbiosName,

          [String]
          $ReplicationSourceDC,

          [String]
          $NewDomainName,

          [String]
          $DomSafePassword
      )
      try {
          $child_domain = Get-ADDomain -Identity $NewDomainName
          $domainExist=$true
      } catch [Microsoft.ActiveDirectory.Management.ADIdentityNotFoundException] {
          $domainExist=$false
      }
      if (-not $domainExist) {
        $Ansible.Changed = $true
        $pass = ConvertTo-SecureString $Password -AsPlainText -Force
        $Cred = New-Object System.Management.Automation.PSCredential ($DomainAdmin, $pass)
        $safePassword = ConvertTo-SecureString $DomSafePassword -AsPlainText -Force
        Install-ADDSDomain -Credential $Cred -SkipPreChecks -InstallDns:$true -NewDomainName $NewDomainName -NewDomainNetbiosName $NewDomainNetbiosName -ParentDomainName $ParentDomainName -ReplicationSourceDC $ReplicationSourceDC -DatabasePath "C:\Windows\NTDS" -SYSVOLPath "C:\Windows\SYSVOL" -LogPath "C:\Windows\Logs" -SafeModeAdministratorPassword $safePassword -Force -NoRebootOnCompletion
      } else {
        $Ansible.Changed = $false
      }
    parameters:
      Password: "{{parent_domain_password}}"
      DomSafePassword: "{{domain_password}}"
      DomainAdmin: "{{parent_domain_user}}"
      ParentDomainName: "{{parent_domain}}"
      ReplicationSourceDC: "{{source_dc}}"
      NewDomainNetbiosName: "{{netbios_name}}"
      NewDomainName: "{{domain.split('.')[0]}}"
  register: child_result
  when: domain_name | default('') != 'NORTH'

- name: Execute guarded NORTH-specific local ADDS child promotion and readiness
  ansible.builtin.include_tasks: north_promotion.yml
  when: domain_name | default('') == 'NORTH'

- name: Reboot legacy GOAD child after domain creation
  win_reboot:
    reboot_timeout: 900
    post_reboot_delay: 100
  when:
    - domain_name | default('') != 'NORTH'
    - child_result.changed

# - name: "enable interface {{nat_adapter}} after domain joined"
