---
# NORTH only. VMware NAT must remain available for WinRM/bootstrap, but must
# never contribute a resolver that can find the separate reference GOAD forest.
# Keep this separate from the common GOAD child-domain promotion path.
- name: Pin NORTH DC02 provisioning NAT DNS to the instance parent controller
  ansible.windows.win_dns_client:
    adapter_names: "{{ nat_adapter }}"
    ipv4_addresses:
      - "{{ hostvars[dns_domain].ansible_host }}"
  when: two_adapters | bool

- name: Prove NORTH DNS and DC Locator cannot discover the reference forest
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param(
        [String]$NatAdapter,
        [String]$DomainAdapter,
        [String]$ParentDns,
        [String]$ParentDomain,
        [String]$ParentDcFqdn,
        [String]$ChildDomain,
        [String]$ChildDcIp
      )
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      function Invoke-NorthDcLocator {
        param([Parameter(Mandatory=$true)][string]$Name)
        # nltest emits ERROR_NO_SUCH_DOMAIN to native stderr on an as-yet
        # nonexistent child. With PowerShell ErrorActionPreference=Stop,
        # invoking nltest directly creates a terminating NativeCommandError
        # before its exit status can be inspected. Capture both native streams
        # without ever emitting an error record into win_powershell.
        $start = New-Object System.Diagnostics.ProcessStartInfo
        $start.FileName = Join-Path $env:SystemRoot 'System32\nltest.exe'
        $start.Arguments = "/dsgetdc:$Name /force"
        $start.UseShellExecute = $false
        $start.RedirectStandardOutput = $true
        $start.RedirectStandardError = $true
        $start.CreateNoWindow = $true
        $proc = [System.Diagnostics.Process]::Start($start)
        if ($null -eq $proc) { throw 'NORTH DC Locator failed to launch' }
        try {
          $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
          $stderrTask = $proc.StandardError.ReadToEndAsync()
          if (-not $proc.WaitForExit(20000)) {
            $proc.Kill()
            throw "NORTH DC Locator timed out for $Name"
          }
          return [pscustomobject]@{
            ExitCode = [int]$proc.ExitCode
            Stdout = $stdoutTask.GetAwaiter().GetResult()
            Stderr = $stderrTask.GetAwaiter().GetResult()
          }
        } finally {
          $proc.Dispose()
        }
      }
      if ($NatAdapter -eq $DomainAdapter) {
        throw "NORTH DNS containment: provisioning and exercise NIC are the same"
      }
      $computer = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
      $natServers = @((Get-DnsClientServerAddress -InterfaceAlias $NatAdapter -AddressFamily IPv4 -ErrorAction Stop).ServerAddresses)
      if ($natServers.Count -ne 1 -or $natServers[0] -ne $ParentDns) {
        throw "NORTH DNS containment: unexpected NAT IPv4 DNS resolver(s): $($natServers -join ',')"
      }
      $labServers = @((Get-DnsClientServerAddress -InterfaceAlias $DomainAdapter -AddressFamily IPv4 -ErrorAction Stop).ServerAddresses)
      $allowed = @($ParentDns)
      if ([int]$computer.DomainRole -eq 5 -and $computer.Domain -ieq $ChildDomain) {
        $allowed += @($ChildDcIp, '127.0.0.1')
      }
      if ($labServers.Count -eq 0 -or @($labServers | Where-Object { $_ -notin $allowed }).Count -gt 0) {
        throw "NORTH DNS containment: unexpected lab IPv4 DNS resolver(s): $($labServers -join ',')"
      }
      $records = @(Resolve-DnsName -Server $ParentDns -Name $ParentDcFqdn -Type A -DnsOnly -ErrorAction Stop)
      if (-not ($records | Where-Object { $_.IPAddress -eq $ParentDns })) {
        throw "NORTH DNS containment: selected parent DNS does not own expected parent DC address"
      }
      # Drop stale resolver cache after removing the foreign VMware NAT DNS.
      Clear-DnsClientCache -ErrorAction Stop
      $parentLookup = Invoke-NorthDcLocator -Name $ParentDomain
      if ($parentLookup.ExitCode -ne 0) {
        throw "NORTH DNS containment: current parent-domain DC Locator failed (code=$($parentLookup.ExitCode))"
      }
      $parentAddressLines = @($parentLookup.Stdout -split '\r?\n' | Where-Object { "$_" -match 'Address:' })
      $parentAddresses = @($parentAddressLines | ForEach-Object {
        [regex]::Matches("$_", '(?:\d{1,3}\.){3}\d{1,3}') | ForEach-Object { $_.Value }
      })
      if ($parentAddresses.Count -ne 1 -or $parentAddresses[0] -ne $ParentDns) {
        throw "NORTH DNS containment: parent DC Locator resolved outside current NORTH instance: $($parentAddresses -join ',')"
      }
      # On a brand-new DC02 this domain MUST NOT resolve to a foreign DC.
      # After a successful promotion, only this instance's child DC is legal.
      $childLookup = Invoke-NorthDcLocator -Name $ChildDomain
      $childStatus = $childLookup.ExitCode
      if ($childStatus -ne 0) {
        # Before promotion, 1355 is the one *expected* negative result:
        # NORTH's child must not exist yet. Accept only a real nltest
        # nonzero result with its exact missing-domain evidence. Never
        # treat timeouts, access failures or foreign DC answers as safe.
        $childError = "$($childLookup.Stdout) $($childLookup.Stderr)"
        # The native process exit value varies by nltest build; the
        # freshly captured Windows status and symbolic error MUST both
        # prove 1355. We are already in the nonzero-exit branch.
        if ($childError -notmatch 'Status\s*=\s*1355\b' -or
            $childError -notmatch 'ERROR_NO_SUCH_DOMAIN') {
          throw "NORTH DNS containment: unexpected child lookup error (code=$childStatus)"
        }
        $childStatus = 1355
      }
      if ($childStatus -eq 0) {
        $childLines = @($childLookup.Stdout -split '\r?\n' | Where-Object { "$_" -match 'Address:' })
        $childAddresses = @($childLines | ForEach-Object {
          [regex]::Matches("$_", '(?:\d{1,3}\.){3}\d{1,3}') | ForEach-Object { $_.Value }
        })
        if ($childAddresses.Count -ne 1 -or $childAddresses[0] -ne $ChildDcIp -or
            [int]$computer.DomainRole -ne 5 -or $computer.Domain -ine $ChildDomain) {
          throw "NORTH DNS containment: child DC Locator resolved to foreign or incomplete domain: $($childAddresses -join ',')"
        }
      }
      Write-Output "NORTH_DNS_CONTAINMENT_OK parent=$ParentDns child_status=$childStatus"
    parameters:
      NatAdapter: "{{ nat_adapter }}"
      DomainAdapter: "{{ domain_adapter }}"
      ParentDns: "{{ hostvars[dns_domain].ansible_host }}"
      ParentDomain: "{{ parent_domain }}"
      ParentDcFqdn: "{{ source_dc }}"
      ChildDomain: "{{ domain }}"
      ChildDcIp: "{{ hostvars[dict_key].ansible_host }}"
  changed_when: false
