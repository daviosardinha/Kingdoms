---
# GOAD Kingdoms Windows LPE framework.
#
# Techniques move through three states:
#   planned -> candidate -> implemented
# Candidate techniques have source apply/validate/reset logic but have not yet
# completed the live apply -> vulnerable -> reset -> clean -> reapply gate for
# their current committed implementation.

windows_lpe_action: status
# Mandatory for identity-dependent scenarios. Supplied by the deployment adapter.
# Shared LPE tasks must never assume a domain or a specific workstation name.
windows_lpe_learner_account: ''
windows_lpe_learner_password: ''
windows_lpe_profile: none
windows_lpe_techniques: []
windows_lpe_validate_state: vulnerable
windows_lpe_allow_candidate: false

windows_lpe_supported_actions:
  - status
  - apply
  - validate
  - reset

windows_lpe_supported_validate_states:
  - vulnerable
  - clean

windows_lpe_catalog:
  - unquoted_service_path
  - weak_service_dacl
  - weak_service_binary_permissions
  - weak_service_registry_permissions
  - service_dll_hijacking
  - path_search_order_hijacking
  - always_install_elevated
  - registry_run_keys
  - writable_startup_folder
  - scheduled_task_binary_permissions
  - scheduled_task_directory_permissions
  - unattend_credentials
  - powershell_history_credentials
  - hardcoded_application_credentials
  - stored_runas_credentials
  - stored_winlogon_credentials
  - sebackup_privilege
  - seimpersonate_privilege
  - writable_program_directory
  - insecure_service_registry

# All 20 deterministic WS01 LPE techniques passed the full reversible runtime
# gate on 2026-09-03 from origin-synced source. No technique remains Candidate.
windows_lpe_candidate_techniques: []

windows_lpe_implemented_techniques:
  - unquoted_service_path
  - weak_service_dacl
  - weak_service_binary_permissions
  - weak_service_registry_permissions
  - service_dll_hijacking
  - path_search_order_hijacking
  - always_install_elevated
  - registry_run_keys
  - writable_startup_folder
  - scheduled_task_binary_permissions
  - scheduled_task_directory_permissions
  - unattend_credentials
  - powershell_history_credentials
  - hardcoded_application_credentials
  - stored_runas_credentials
  - stored_winlogon_credentials
  - sebackup_privilege
  - seimpersonate_privilege
  - writable_program_directory
  - insecure_service_registry

windows_lpe_profiles:
  none: []
  service-abuse:
    - unquoted_service_path
    - weak_service_dacl
    - weak_service_binary_permissions
    - weak_service_registry_permissions
    - service_dll_hijacking
    - path_search_order_hijacking
  credential-hunting:
    - unattend_credentials
    - powershell_history_credentials
    - hardcoded_application_credentials
    - stored_runas_credentials
    - stored_winlogon_credentials
  registry-abuse:
    - always_install_elevated
    - registry_run_keys
    - writable_startup_folder
    - insecure_service_registry
  token-abuse:
    - sebackup_privilege
    - seimpersonate_privilege
  mixed:
    - unquoted_service_path
    - weak_service_binary_permissions
    - always_install_elevated
    - scheduled_task_binary_permissions
    - hardcoded_application_credentials
    - seimpersonate_privilege
  full-lpe: "{{ windows_lpe_catalog }}"

windows_lpe_unquoted_service_path:
  service_name: KingdomUpdaterSvc
  display_name: GOAD Kingdoms Update Service
  root: 'C:\Kingdom LPE'
  scenario_directory: 'C:\Kingdom LPE\Unquoted Path'
  service_directory: 'C:\Kingdom LPE\Unquoted Path\Service'
  executable: 'C:\Kingdom LPE\Unquoted Path\Service\KingdomUpdater.exe'
  writable_candidate: 'C:\Kingdom LPE\Unquoted.exe'

windows_lpe_weak_service_dacl:
  service_name: KingdomControlSvc
  display_name: GOAD Kingdoms Control Service
  root: 'C:\Kingdom LPE\Weak Service DACL'
  executable: 'C:\Kingdom LPE\Weak Service DACL\KingdomControl.exe'

windows_lpe_weak_service_binary_permissions:
  service_name: KingdomBinarySvc
  display_name: GOAD Kingdoms Binary Service
  root: 'C:\Kingdom LPE\Weak Service Binary'
  executable: 'C:\Kingdom LPE\Weak Service Binary\KingdomBinary.exe'

windows_lpe_weak_service_registry_permissions:
  service_name: KingdomRegistrySvc
  display_name: GOAD Kingdoms Registry Service
  root: 'C:\Kingdom LPE\Weak Service Registry'
  executable: 'C:\Kingdom LPE\Weak Service Registry\KingdomRegistry.exe'

windows_lpe_service_dll_hijacking:
  service_name: KingdomDllSvc
  display_name: GOAD Kingdoms DLL Loader Service
  root: 'C:\Kingdom LPE\DLL Hijack'
  service_directory: 'C:\Kingdom LPE\DLL Hijack\Service'
  executable: 'C:\Kingdom LPE\DLL Hijack\Service\KingdomDllHost.exe'
  writable_dll: 'C:\Kingdom LPE\DLL Hijack\KingdomHelper.dll'

windows_lpe_path_search_order_hijacking:
  service_name: KingdomPathSvc
  display_name: GOAD Kingdoms PATH Search Service
  root: 'C:\Kingdom LPE\Path Search'
  service_directory: 'C:\Kingdom LPE\Path Search\Service'
  executable: 'C:\Kingdom LPE\Path Search\Service\KingdomPathSvc.exe'
  writable_directory: 'C:\Kingdom LPE\Path Search\UserBin'
  protected_directory: 'C:\Kingdom LPE\Path Search\SystemBin'
  helper_name: KingdomPathHelper.exe
  protected_helper: 'C:\Kingdom LPE\Path Search\SystemBin\KingdomPathHelper.exe'

windows_lpe_always_install_elevated:
  target_account: "{{ windows_lpe_learner_account }}"
  target_password: "{{ windows_lpe_learner_password }}"
  root: 'C:\Kingdom LPE\AlwaysInstallElevated'
  state_file: 'C:\Kingdom LPE\AlwaysInstallElevated\state.json'

windows_lpe_registry_run_keys:
  root: 'C:\Kingdom LPE\Registry Run Keys'
  state_file: 'C:\Kingdom LPE\Registry Run Keys\state.json'
  registry_subkey: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
  value_name: KingdomAdminAgent
  command: 'C:\Windows\System32\cmd.exe /d /c exit 0'

windows_lpe_writable_startup_folder:
  root: 'C:\Kingdom LPE\Writable Startup Folder'
  state_file: 'C:\Kingdom LPE\Writable Startup Folder\state.json'
  startup_directory: 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'
  marker_name: KingdomStartupAgent.cmd

windows_lpe_scheduled_task_binary_permissions:
  task_name: KingdomTaskBinary
  root: 'C:\Kingdom LPE\Scheduled Task Binary'
  executable: 'C:\Kingdom LPE\Scheduled Task Binary\KingdomTaskBinary.exe'

windows_lpe_scheduled_task_directory_permissions:
  task_name: KingdomTaskDirectory
  root: 'C:\Kingdom LPE\Scheduled Task Directory'
  directory: 'C:\Kingdom LPE\Scheduled Task Directory\Bin'
  executable: 'C:\Kingdom LPE\Scheduled Task Directory\Bin\KingdomTaskDirectory.exe'

windows_lpe_unattend_credentials:
  user_name: kingdom.deploy
  password: 'RedKeep-Deploy-2026!'
  artifact: 'C:\Windows\Panther\Kingdom-Unattend.xml'

windows_lpe_powershell_history_credentials:
  target_account: "{{ windows_lpe_learner_account }}"
  user_name: kingdom.pshistory
  password: 'Kingdom-PSHistory-2026!'

windows_lpe_hardcoded_application_credentials:
  user_name: kingdom.appsvc
  password: 'Kingdom-AppSvc-2026!'
  root: 'C:\ProgramData\KingdomMonitor'
  config: 'C:\ProgramData\KingdomMonitor\monitoring.ini'

windows_lpe_stored_runas_credentials:
  owner_account: "{{ windows_lpe_learner_account }}"
  owner_password: "{{ windows_lpe_learner_password }}"
  user_name: kingdom.runas
  password: 'Kingdom-RunAs-2026!!'
  credential_target: 'WS01\kingdom.runas'
  root: 'C:\Kingdom LPE\Stored RunAs'

windows_lpe_stored_winlogon_credentials:
  user_name: kingdom.autologon
  password: 'Kingdom-Autologon-2026!'
  root: 'C:\Kingdom LPE\Winlogon Credentials'
  backup_file: 'C:\Kingdom LPE\Winlogon Credentials\winlogon-backup.json'

windows_lpe_sebackup_privilege:
  target_account: "{{ windows_lpe_learner_account }}"
  right: SeBackupPrivilege
  root: 'C:\Kingdom LPE\User Rights\SeBackupPrivilege'
  state_file: 'C:\Kingdom LPE\User Rights\SeBackupPrivilege\state.json'

windows_lpe_seimpersonate_privilege:
  target_account: "{{ windows_lpe_learner_account }}"
  right: SeImpersonatePrivilege
  root: 'C:\Kingdom LPE\User Rights\SeImpersonatePrivilege'
  state_file: 'C:\Kingdom LPE\User Rights\SeImpersonatePrivilege\state.json'

windows_lpe_writable_program_directory:
  service_name: KingdomProgramSvc
  display_name: GOAD Kingdoms Program Files Service
  root: 'C:\Program Files\Kingdom Agent'
  executable: 'C:\Program Files\Kingdom Agent\KingdomAgent.exe'

windows_lpe_insecure_service_registry:
  service_name: KingdomConfigSvc
  display_name: GOAD Kingdoms Registry Config Service
  root: 'C:\Kingdom LPE\Insecure Service Registry'
  service_directory: 'C:\Kingdom LPE\Insecure Service Registry\Service'
  executable: 'C:\Kingdom LPE\Insecure Service Registry\Service\KingdomConfigSvc.exe'
  helper_directory: 'C:\Kingdom LPE\Insecure Service Registry\Protected'
  helper_executable: 'C:\Kingdom LPE\Insecure Service Registry\Protected\KingdomConfigHelper.exe'
  registry_key: 'HKLM:\SOFTWARE\GOAD Kingdoms\KingdomConfigSvc'
  registry_subkey: 'SOFTWARE\GOAD Kingdoms\KingdomConfigSvc'
  registry_value: HelperPath
