---
# NORTH exercise-mode health acceptance. No repair, restart, host route, NAT
# reconnection, or AD writes. Root PDC is verified via permitted DC02->DC01.
- name: Verify NORTH identity health from accessible exercise-zone guests
  hosts: dc02:srv02:ws01
  gather_facts: false
  tasks:
    - name: Assert Active Directory, time, and secure-channel readiness
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false

          $expected = if ($env:COMPUTERNAME -eq 'WINTERFELL') {
              'north.sevenkingdoms.local'
          } elseif ($env:COMPUTERNAME -in @('CASTELBLACK', 'WS01')) {
              'north.sevenkingdoms.local'
          } else {
              throw "Unexpected NORTH exercise guest: $env:COMPUTERNAME"
          }

          $computer = Get-CimInstance Win32_ComputerSystem
          if (-not $computer.PartOfDomain -or $computer.Domain -ine $expected) {
              throw "Wrong domain: $($computer.Domain), expected $expected"
          }

          $required = if ($env:COMPUTERNAME -eq 'WINTERFELL') {
              @('NTDS', 'DNS', 'ADWS', 'Netlogon', 'Kdc', 'W32Time')
          } else {
              @('Netlogon', 'W32Time')
          }
          foreach ($service in $required) {
              $status = (Get-Service -Name $service -ErrorAction Stop).Status
              if ($status -ne 'Running') {
                  throw "$service is $status on $env:COMPUTERNAME"
              }
          }

          $dns = Resolve-DnsName '_ldap._tcp.dc._msdcs.north.sevenkingdoms.local' -Type SRV -ErrorAction Stop
          if (-not $dns) { throw 'NORTH DC SRV lookup returned no records' }
          $locator = & nltest.exe '/dsgetdc:north.sevenkingdoms.local' 2>&1
          if ($LASTEXITCODE -ne 0) {
              throw "NORTH DC Locator failed: $($locator -join ' ')"
          }

          if ($env:COMPUTERNAME -eq 'WINTERFELL') {
              foreach ($share in @('SYSVOL', 'NETLOGON')) {
                  if (-not (Get-SmbShare -Name $share -ErrorAction SilentlyContinue)) {
                      throw "Missing share: $share"
                  }
              }
              Import-Module ActiveDirectory -ErrorAction Stop
              Get-ADRootDSE -Server 'winterfell.north.sevenkingdoms.local' -ErrorAction Stop | Out-Null
              $parent = & nltest.exe '/dsgetdc:sevenkingdoms.local' 2>&1
              if ($LASTEXITCODE -ne 0 -or ($parent -join ' ') -notmatch '10\.4\.20\.10') {
                  throw "Parent-domain DC discovery failed: $($parent -join ' ')"
              }
              $timeSource = (& w32tm.exe /query /source 2>&1 | Out-String).Trim().TrimEnd('.')
              if ($LASTEXITCODE -ne 0 -or $timeSource -ine 'kingslanding.sevenkingdoms.local') {
                  throw "Child PDC time hierarchy unhealthy: $timeSource"
              }
          } else {
              if (-not (Test-ComputerSecureChannel -Server 'winterfell.north.sevenkingdoms.local' -ErrorAction Stop)) {
                  throw 'NORTH domain secure channel is unhealthy'
              }
              $sc = & nltest.exe '/sc_query:north.sevenkingdoms.local' 2>&1
              if ($LASTEXITCODE -ne 0) {
                  throw "Netlogon secure-channel query failed: $($sc -join ' ')"
              }
              $timeSource = (& w32tm.exe /query /source 2>&1 | Out-String).Trim().TrimEnd('.')
              if ($LASTEXITCODE -ne 0 -or $timeSource -ine 'winterfell.north.sevenkingdoms.local') {
                  throw "NORTH member time hierarchy unhealthy: $timeSource"
              }
          }

          Write-Output "NORTH_EXERCISE_AD_HEALTH=PASS host=$env:COMPUTERNAME"
      changed_when: false
      register: north_runtime_probe

    - name: Expose identity proof for host-by-host runtime acceptance
      ansible.builtin.debug:
        msg: "{{ north_runtime_probe.output | join(' | ') }}"

# Parent DC stays isolated from Linux. Use the existing Windows remote-shell
# endpoint over the permitted DC02 -> DC01 path, with DC01 inventory credentials.
- name: Verify KINGSLANDING directly through the permitted inter-DC path
  hosts: dc02
  gather_facts: false
  tasks:
    - name: Assert root PDC services SYSVOL NETLOGON DNS and time authority
      ansible.windows.win_powershell:
        script: |
          param([PSCredential]$ParentCredential)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          {{ lookup('ansible.builtin.file', 'files/north-parent-winrs.ps1') | indent(10) }}
          $proofScript = @'
          {{ lookup('ansible.builtin.file', 'files/north-parent-dc-health.ps1') | indent(10) }}
          '@
          Assert-NorthParentPath
          $credential = Get-NorthParentCredential $ParentCredential
          $result = Invoke-NorthParentWinRS -Credential $credential -Script $proofScript
          if ($result.ExitCode -ne 0 -or
              @($result.Stdout -split '[\r\n]+' | Where-Object {
                  $_ -ceq 'NORTH_PARENT_DC_AD_HEALTH=PASS host=KINGSLANDING'
              }).Count -ne 1) {
              throw 'KINGSLANDING authenticated health proof failed; no recovery attempted'
          }
          Write-Output 'NORTH_PARENT_DC_AD_HEALTH=PASS host=KINGSLANDING'
        sensitive_parameters:
          - name: ParentCredential
            username: "{{ hostvars['dc01'].ansible_user }}"
            password: "{{ hostvars['dc01'].ansible_password }}"
      changed_when: false
      register: north_parent_dc_probe

    - name: Expose authenticated root PDC proof for runtime acceptance
      ansible.builtin.debug:
        msg: "{{ north_parent_dc_probe.output | join(' | ') }}"
