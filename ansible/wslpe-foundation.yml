---
# WSLPE's native Kingdoms-core provisioning stage, not the full LPE course.
# Only a local standard learner and baseline Windows readiness are established.
# No DC/domain join, remote victim, or LPE scenario is installed here.
#
# The operator sets KINGDOMS_WSLPE_LEARNER_PASSWORD in the trusted provisioner
# process environment. No training password is committed to source control.

- name: Validate independent WSLPE operator input
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require a learner password outside Git and Ansible inventory
      ansible.builtin.assert:
        that:
          - (lookup('ansible.builtin.env', 'KINGDOMS_WSLPE_LEARNER_PASSWORD') | length) >= 12
        fail_msg: >-
          Set KINGDOMS_WSLPE_LEARNER_PASSWORD in the private operator
          environment before provisioning WSLPE. Do not commit it.
        quiet: true
      no_log: true

- name: Establish local-only Windows LPE learner foundation
  hosts: wslpe
  gather_facts: false
  vars:
    wslpe_learner_name: lpe.trainee
    wslpe_learner_password: "{{ lookup('ansible.builtin.env', 'KINGDOMS_WSLPE_LEARNER_PASSWORD') }}"
  tasks:
    - name: Prove Windows client and domain-free security baseline
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          $computer = Get-CimInstance Win32_ComputerSystem
          if ($os.ProductType -ne 1) {
            throw 'WSLPE requires a Windows client OS'
          }
          if ($computer.PartOfDomain) {
            throw 'WSLPE must never join an Active Directory domain'
          }
          $uac = Get-ItemPropertyValue -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA
          if ([int]$uac -ne 1) {
            throw 'WSLPE baseline requires UAC enabled'
          }
          if (@(Get-NetFirewallProfile | Where-Object { ([string]$_.Enabled) -ne 'True' }).Count -gt 0) {
            throw 'WSLPE baseline requires all Windows Firewall profiles enabled'
          }
          $defender = Get-MpComputerStatus
          if (-not $defender.AMServiceEnabled -or -not $defender.AntivirusEnabled) {
            throw 'WSLPE baseline requires Microsoft Defender running'
          }
          Write-Output ('WSLPE_WINDOWS_BUILD=' + $os.BuildNumber)
          Write-Output 'WSLPE_WINDOWS_STANDALONE=PASS'
      changed_when: false

    # Reuse the already deployed NORTH WS01 evaluation role, not a second
    # licensing implementation. Runs only in WSLPE's operator provisioning
    # context. It rearms exclusively expired TIMEBASED_EVAL installations and
    # verifies remaining grace after the role-controlled reboot.
    - name: Maintain approved Windows evaluation grace before learner creation
      ansible.builtin.import_role:
        name: settings/eval_rearm

    - name: Require enough Windows evaluation grace for a training session
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $products = @(Get-CimInstance SoftwareLicensingProduct -ErrorAction Stop |
              Where-Object { $_.Name -like 'Windows*' -and $_.PartialProductKey })
          $eval = @($products | Where-Object {
              $_.Description -match 'TIMEBASED_EVAL'
          } | Select-Object -First 1)
          if ($eval.Count -gt 0) {
            $grace = [int64]$eval[0].GracePeriodRemaining
            if ($grace -lt 1440) {
              throw "WSLPE time-based Windows evaluation has less than 24h of grace ($grace minutes). Do not release to learners."
            }
            Write-Output "WSLPE_LICENSE=TIMEBASED_EVAL"
            Write-Output "WSLPE_LICENSE_GRACE_MINUTES=$grace"
          }
          elseif (@($products | Where-Object {
              [int]$_.LicenseStatus -eq 1
          }).Count -gt 0) {
            Write-Output 'WSLPE_LICENSE=LICENSED_NON_EVAL'
          }
          else {
            throw 'WSLPE Windows licensing is unverified or not activated'
          }
          Write-Output 'WSLPE_LICENSE_READY=PASS'
      changed_when: false

    - name: Create standard local WSLPE learner
      ansible.windows.win_user:
        name: "{{ wslpe_learner_name }}"
        password: "{{ wslpe_learner_password }}"
        state: present
        account_disabled: false
        groups:
          - Users
        groups_action: replace
        password_never_expires: true
      no_log: true

    - name: Verify the learner remains outside local Administrators
      ansible.windows.win_powershell:
        parameters:
          LearnerName: "{{ wslpe_learner_name }}"
        script: |
          param([Parameter(Mandatory = $true)][string] $LearnerName)
          $ErrorActionPreference = 'Stop'
          $learner = Get-LocalUser -Name $LearnerName -ErrorAction Stop
          if (-not $learner.Enabled) {
            throw 'WSLPE local learner is disabled'
          }
          $admins = (New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-544')).Translate([System.Security.Principal.NTAccount]).Value
          $members = @(Get-LocalGroupMember -Group $admins)
          if ($members | Where-Object { $_.SID.Value -eq $learner.SID.Value }) {
            throw 'WSLPE local learner has administrator membership'
          }
          Write-Output 'WSLPE_LOCAL_LEARNER=PASS'
      changed_when: false
