---
# PURPLE-only DNS naming and a delegated child-zone for Sliver DNS C2.
# This playbook is called after Active Directory DNS provisioning.
# It never changes the global forwarders or _msdcs delegation.
- name: Provision PURPLE Sliver DNS naming and delegation
  hosts: parent_dc
  gather_facts: false
  tasks:
    - name: Verify the intended DC and existing AD-integrated parent zone
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        if ($env:COMPUTERNAME -ne 'PURPLE-DC01') {
          throw 'Refusing DNS changes outside PURPLE-DC01'
        }
        $zone = Get-DnsServerZone -Name 'purple.lab' -ErrorAction Stop
        if ($zone.ZoneType -ne 'Primary' -or -not $zone.IsDsIntegrated) {
          throw 'Expected the existing AD-integrated purple.lab primary zone'
        }
        Write-Output 'PURPLE_DNS_PARENT_VERIFIED=1'
      changed_when: false

    - name: Create only missing C2 and LX01 A records
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $hostname = '{{ item.name }}'
        $wanted = '{{ item.ip }}'
        $existing = @(Get-DnsServerResourceRecord -ZoneName 'purple.lab' -Name $hostname -RRType A -ErrorAction SilentlyContinue)
        if ($existing.Count -eq 0) {
          Add-DnsServerResourceRecordA -ZoneName 'purple.lab' -Name $hostname -IPv4Address $wanted -TimeToLive (New-TimeSpan -Minutes 5) -ErrorAction Stop
          Write-Output 'PURPLE_DNS_A_CHANGED=1'
        } else {
          $addresses = @($existing | ForEach-Object { $_.RecordData.IPv4Address.ToString() })
          if ($addresses.Count -ne 1 -or $addresses[0] -ne $wanted) {
            throw "Conflicting purple.lab DNS A record for $hostname. Refusing overwrite."
          }
          Write-Output 'PURPLE_DNS_A_UNCHANGED=1'
        }
      loop:
        - { name: 'purple-c2', ip: '172.28.233.60' }
        - { name: 'purple-lx01', ip: '172.28.233.32' }
      register: purple_dns_a_result
      changed_when: "'PURPLE_DNS_A_CHANGED=1' in purple_dns_a_result.stdout"

    - name: Create only the dedicated c2.purple.lab delegation
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        # Missing -ChildZoneName raises a terminating WIN32 9714 error on first run.
        # Enumerate the existing parent-zone delegations instead, preserving _msdcs.
        $allDelegations = @(Get-DnsServerZoneDelegation -Name 'purple.lab' -ErrorAction Stop)
        $existing = @($allDelegations | Where-Object {
          ([string]$_.ChildZoneName).TrimEnd('.').ToLowerInvariant() -eq 'c2.purple.lab'
        })
        if ($existing.Count -eq 0) {
          Add-DnsServerZoneDelegation -Name 'purple.lab' -ChildZoneName 'c2' -NameServer 'purple-c2.purple.lab' -IPAddress '172.28.233.60' -ErrorAction Stop | Out-Null
          Write-Output 'PURPLE_DNS_DELEGATION_CHANGED=1'
        } else {
          $ns = @(Get-DnsServerResourceRecord -ZoneName 'purple.lab' -Name 'c2' -RRType NS -ErrorAction SilentlyContinue)
          $names = @($ns | ForEach-Object { $_.RecordData.NameServer.ToString().TrimEnd('.').ToLowerInvariant() })
          $glue = @($existing | ForEach-Object { $_.IPAddress } | ForEach-Object { $_.RecordData.IPv4Address.ToString() })
          if ($existing.Count -ne 1 -or $names.Count -ne 1 -or $names[0] -ne 'purple-c2.purple.lab' -or $glue.Count -ne 1 -or $glue[0] -ne '172.28.233.60') {
            throw 'Conflicting c2.purple.lab delegation. Refusing overwrite.'
          }
          Write-Output 'PURPLE_DNS_DELEGATION_UNCHANGED=1'
        }
      register: purple_dns_delegation_result
      changed_when: "'PURPLE_DNS_DELEGATION_CHANGED=1' in purple_dns_delegation_result.stdout"

    - name: Verify the published DNS records without claiming Sliver DNS is active
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $expected = @{ 'purple-c2' = '172.28.233.60'; 'purple-lx01' = '172.28.233.32' }
        foreach ($hostname in $expected.Keys) {
          $records = @(Get-DnsServerResourceRecord -ZoneName 'purple.lab' -Name $hostname -RRType A -ErrorAction Stop)
          if ($records.Count -ne 1 -or $records[0].RecordData.IPv4Address.ToString() -ne $expected[$hostname]) {
            throw "DNS verification failed for $hostname"
          }
        }
        $allDelegations = @(Get-DnsServerZoneDelegation -Name 'purple.lab' -ErrorAction Stop)
        $delegation = @($allDelegations | Where-Object {
          ([string]$_.ChildZoneName).TrimEnd('.').ToLowerInvariant() -eq 'c2.purple.lab'
        })
        if ($delegation.Count -ne 1) { throw 'Expected exactly one dedicated c2 DNS delegation' }
        Write-Output 'PURPLE_DNS_C2_PROVISIONED=1'
      changed_when: false
