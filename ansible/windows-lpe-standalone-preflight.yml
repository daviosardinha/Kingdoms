---
# Read-only readiness check for an independently provisioned, domain-free
# Windows workstation. This playbook does not create users, join domains,
# install scenarios, or alter the guest. It must not target GOAD-WS01.
#
# Usage (on a separate test VM, after provisioning it):
# ansible-playbook -i <standalone-inventory> ansible/windows-lpe-standalone-preflight.yml \
#   -e windows_lpe_standalone_expected_build=<pinned-build>
#
# The inventory must use the distinct "windows_lpe_standalone" group.

- name: Verify standalone Windows LPE target without mutating it
  hosts: windows_lpe_standalone
  gather_facts: false
  vars:
    windows_lpe_standalone_learner: lpe.trainee
  pre_tasks:
    - name: Require explicit pinned Windows build
      ansible.builtin.assert:
        that:
          - windows_lpe_standalone_expected_build is defined
          - (windows_lpe_standalone_expected_build | default('') | string | length) > 0
        fail_msg: >-
          Specify windows_lpe_standalone_expected_build for the separately
          provisioned Windows guest. Do not run this against Kingdoms GOAD-WS01.

  tasks:
    - name: Check no domain join, local learner, and baseline security
      ansible.windows.win_powershell:
        parameters:
          ExpectedBuild: "{{ windows_lpe_standalone_expected_build | string }}"
          LearnerName: "{{ windows_lpe_standalone_learner }}"
        script: |
          param(
            [Parameter(Mandatory = $true)][string] $ExpectedBuild,
            [Parameter(Mandatory = $true)][string] $LearnerName
          )
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          $computer = Get-CimInstance -ClassName Win32_ComputerSystem

          if ($os.ProductType -ne 1) {
            throw 'Standalone Windows LPE target must be a Windows client OS'
          }
          if ($computer.PartOfDomain) {
            throw 'Standalone Windows LPE target is domain joined; refusing'
          }
          if ([string]$os.BuildNumber -ne $ExpectedBuild) {
            throw "Windows build mismatch: actual=$($os.BuildNumber), expected=$ExpectedBuild"
          }

          $user = Get-LocalUser -Name $LearnerName -ErrorAction Stop
          if (-not $user.Enabled) {
            throw "Local learner $LearnerName is disabled"
          }
          $administratorsName = (
            New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-544')
          ).Translate([System.Security.Principal.NTAccount]).Value
          $members = @(Get-LocalGroupMember -Group $administratorsName)
          if ($members | Where-Object { $_.SID.Value -eq $user.SID.Value }) {
            throw "Local learner $LearnerName is a direct local Administrator"
          }

          $uac = Get-ItemPropertyValue -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA
          if ([int]$uac -ne 1) {
            throw 'UAC EnableLUA is not enabled'
          }

          $disabledProfiles = @(Get-NetFirewallProfile | Where-Object { -not $_.Enabled })
          if ($disabledProfiles.Count -gt 0) {
            throw 'At least one Windows Firewall profile is disabled'
          }
          $defender = Get-MpComputerStatus
          if (-not $defender.AMServiceEnabled -or -not $defender.AntivirusEnabled) {
            throw 'Microsoft Defender baseline is not healthy'
          }

          Write-Output 'WINDOWS_LPE_STANDALONE_PREFLIGHT=PASS'
          Write-Output ("WINDOWS_BUILD={0}" -f $os.BuildNumber)
          Write-Output ("LOCAL_LEARNER={0}" -f $user.Name)
          Write-Output 'DOMAIN_JOINED=FALSE'
          Write-Output 'UAC_FIREWALL_DEFENDER=ENABLED'
      changed_when: false
