---
# WSLPE-only profile repair for the existing shared AlwaysInstallElevated role.
# The NORTH role is not modified. Called only by the --execute fast-track
# operator after exact native WSLPE registration/inventory verification.
# No Vagrant, VMware, NAT, firewall, AD or NORTH operations.
- name: Authorize exact WSLPE preflight
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require a single standalone WSLPE guest and no NORTH inventory
      ansible.builtin.assert:
        that:
          - (groups.get('wslpe', []) | length) == 1
          - (groups.get('wslpe', [])) == ['ws01']
          - (groups.get('windows_lpe_standalone', [])) == ['ws01']
          - (groups.get('dc', []) | length) == 0
          - (groups.get('domain', []) | length) == 0
        fail_msg: "Refusing profile preparation outside native standalone WSLPE"

- name: Prepare profile without delegated interactive credentials
  hosts: wslpe
  gather_facts: false
  tasks:
    - name: Create/verify local learner profile and clear only empty failed candidate directory
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $system = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          if ($system.PartOfDomain -or $env:COMPUTERNAME -ne 'WSLPE-WS01') {
              throw 'Refusing to prepare an AD-joined or foreign workstation'
          }
          $account = Get-LocalUser -Name 'lpe.trainee' -ErrorAction Stop
          if (-not $account.Enabled) { throw 'The local learner is disabled' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $adminSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-544')
          $principal = New-Object System.Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole($adminSid)) {
              throw 'Profile preparation requires the existing elevated provisioning session'
          }
          $admins = Get-LocalGroup -SID $adminSid -ErrorAction Stop
          $members = @(Get-LocalGroupMember -Group $admins.Name -ErrorAction Stop)
          if (@($members | Where-Object { $_.SID.Value -eq $account.SID.Value }).Count -gt 0) {
              throw 'The training learner must not be a local administrator'
          }
          $sid = $account.SID.Value
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
          if (-not (Test-Path -LiteralPath $profileKey)) {
              # CreateProfileW is a supported Windows API for administrator-side
              # local profile creation. Do not launch cmd.exe via Start-Process
              # -Credential in an already remote WinRM provisioning session.
              $definition = @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class WslpeProfileNative {
              [DllImport("userenv.dll", CharSet = CharSet.Unicode,
                         EntryPoint = "CreateProfileW", ExactSpelling = true)]
              public static extern int CreateProfile(
                  string userSid, string userName,
                  StringBuilder profilePath, uint chars);
          }
          '@
              Add-Type -TypeDefinition $definition -ErrorAction Stop
              $buffer = New-Object System.Text.StringBuilder(1024)
              $result = [WslpeProfileNative]::CreateProfile(
                  $sid, $account.Name, $buffer, [uint32]$buffer.Capacity)
              if ($result -ne 0 -and -not (Test-Path -LiteralPath $profileKey)) {
                  throw "CreateProfileW failed for standalone learner, HRESULT=$result"
              }
              $Ansible.Changed = $true
          }
          else {
              $Ansible.Changed = $false
          }
          $profile = [Environment]::ExpandEnvironmentVariables(
              (Get-ItemProperty -LiteralPath $profileKey -ErrorAction Stop).ProfileImagePath)
          if (-not $profile -or -not (Test-Path -LiteralPath (Join-Path $profile 'NTUSER.DAT') -PathType Leaf)) {
              throw 'Local learner profile registry hive is missing; refusing technique apply'
          }
          Write-Output 'WSLPE_LOCAL_LEARNER_PROFILE=READY'

          # A failed original shared-role apply creates this directory BEFORE
          # attempting Start-Process. Remove ONLY an EMPTY untracked fixture.
          # Do not delete unknown files, saved state.json or a pre-existing
          # AlwaysInstallElevated machine policy.
          $root = 'C:\Kingdom LPE\AlwaysInstallElevated'
          $machinePath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
          $previous = Get-ItemProperty -LiteralPath $machinePath -Name AlwaysInstallElevated -ErrorAction SilentlyContinue
          if ($null -ne $previous -and [int]$previous.AlwaysInstallElevated -eq 1) {
              throw 'HKLM AlwaysInstallElevated already enabled without approved fixture state'
          }
          if (Test-Path -LiteralPath $root) {
              $item = Get-Item -LiteralPath $root -Force -ErrorAction Stop
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or -not $item.PSIsContainer) {
                  throw 'Unexpected candidate fixture or reparse point; manual inspection required'
              }
              if (Test-Path -LiteralPath (Join-Path $root 'state.json')) {
                  throw 'Candidate has a state snapshot; refusing to overwrite it'
              }
              if (@(Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop).Count -gt 0) {
                  throw 'Candidate directory contains unexpected data; refusing cleanup'
              }
              Remove-Item -LiteralPath $root -Force -ErrorAction Stop
              $Ansible.Changed = $true
              Write-Output 'WSLPE_FAILED_APPLY_EMPTY_DIRECTORY=REMOVED'
          }
          Write-Output 'WSLPE_ALWAYS_INSTALL_ELEVATED_PREFLIGHT=PASS'
