---
# GOAD Kingdoms only. Existing NORTH ACLs must already have been provisioned.
- name: Load Phase 01 scenario data without contacting other zones
  hosts: dc02:srv02
  gather_facts: false
  tasks:
    - name: Require the Kingdoms scenario
      ansible.builtin.assert:
        that: domain_name in ['GOAD', 'NORTH']
        fail_msg: Phase 01 requires the validated Kingdoms full or Course 1 NORTH scenario.
    - name: Load canonical Kingdoms data
      ansible.builtin.include_vars:
        file: "../ad/{{ domain_name }}/data/config.json"

- name: Provision WINTERFELL enumeration lessons
  hosts: dc02
  gather_facts: false
  roles:
    - role: phase01/dc

- name: Provision CASTELBLACK HTTP authentication boundary
  hosts: srv02
  gather_facts: false
  roles:
    - role: phase01/iis
