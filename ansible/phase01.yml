---
# Patched Kingdoms Phase 01 for full GOAD or native NORTH; use selected lab data.
- name: Load Phase 01 scenario data without contacting other zones
  hosts: dc02:srv02
  gather_facts: false
  tasks:
    - name: Require the Kingdoms scenario
      ansible.builtin.assert:
        that: domain_name in ['GOAD', 'NORTH']
        fail_msg: Phase 01 requires a native Kingdoms GOAD or NORTH lab.
    - name: Load canonical Kingdoms data
      ansible.builtin.include_vars:
        file: "../ad/{{ domain_name }}/data/config.json"

- name: Provision WINTERFELL enumeration lessons
  hosts: dc02
  gather_facts: false
  roles:
    - role: phase01/dc

- name: Provision CASTELBLACK HTTP authentication boundary
  hosts: srv02
  gather_facts: false
  roles:
    - role: phase01/iis
