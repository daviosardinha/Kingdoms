# GOAD Kingdoms has first-class WS01 foundation and deterministic Windows LPE
# stages. Keep these explicit instead of relying on the upstream default list so
# a clean `GOAD` install reproduces the exact training state validated in M2.
GOAD:
  - build.yml
  - ad-servers.yml
  - ad-parent_domain.yml
  # Wait after the child domain creation before adding servers
  - ad-child_domain.yml
  # Waiting 5 minutes for the child domain to be ready
  - wait5m.yml
  - ad-members.yml
  - kingdoms-time-backoff.yml
  - ad-trusts.yml
  - ad-data.yml
  # Rickon exists after ad-data; now establish the validated WS01 foothold
  # baseline (evaluation grace, domain state and intended local rights).
  - ws01.yml
  - ad-gmsa.yml
  - laps.yml
  - ad-relations.yml
  - adcs.yml
  - ad-acl.yml
  - servers.yml
  - security.yml
  # Prove every Windows machine is AD-healthy before domain-context
  # vulnerability tasks. Only members/workstations may self-repair trust/time.
  - kingdoms-health.yml
  - vulnerabilities.yml
  # Phase 01 follows ACLs and existing IIS content/security provisioning.
  - phase01.yml
  # Seed all 20 promoted Windows LPE techniques, then fail closed if AD health
  # drifted during vulnerability/LPE provisioning.
  - ws01-lpe-install.yml
  - kingdoms-health-final.yml

# NORTH is the native two-domain Course 1 on the patched Kingdoms installer.
# Follow the full Kingdoms Windows/AD/WS01 health and teaching stages; omit
# external ESSOS trust setup. Parent/child AD remains configured in
# ad-child_domain.yml, and Phase 01 now loads the selected lab's data.
NORTH:
  - build.yml
  - ad-servers.yml
  - ad-parent_domain.yml
  - ad-child_domain.yml
  - wait5m.yml
  - ad-members.yml
  - kingdoms-time-backoff.yml
